<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Matemáticas B — 4.º ESO</title>
  <style>
    :root {
      color-scheme: light;
      --texto: #182033;
      --texto-suave: #4b5568;
      --fondo: #f2f5fa;
      --superficie: #ffffff;
      --borde: #d6dce7;
      --acento: #2557a7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 68rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 6rem) clamp(1rem, 5vw, 3rem);
      color: var(--texto);
      background: var(--fondo);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      line-height: 1.65;
    }

    /* La cabecera es una banda de portada: el título, en blanco sobre el
       degradado, con una curva al fondo. */
    header {
      position: relative;
      overflow: hidden;
      margin-bottom: 2.4rem;
      padding: clamp(1.5rem, 4.4vw, 2.7rem) clamp(1.3rem, 4vw, 2.6rem);
      background:
        radial-gradient(circle at 90% 8%, rgb(255 255 255 / 0.2), transparent 34%),
        linear-gradient(118deg, #142a5c 0%, #1d4ed8 56%, #6d28d9 100%);
      border-radius: 1.1rem;
      box-shadow: 0 14px 34px rgb(22 59 114 / 0.16);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .adorno-banda {
      position: absolute;
      top: 0;
      right: 0;
      width: auto;
      height: 100%;
      opacity: 0.55;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
    }

    h1 {
      position: relative;
      margin: 0 0 0.7rem;
      color: #ffffff;
      font-size: clamp(2.1rem, 6.2vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    /* El título separa el nivel, en un antetítulo, de la materia, en
       grande. Cada portal lo viste a su manera: aquí, sobre la banda. */
    .antetitulo-portal {
      position: relative;
      margin: 0 0 0.5rem;
      color: rgb(255 255 255 / 0.84);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .subtitulo {
      position: relative;
      max-width: 48rem;
      margin: 0;
      color: rgb(255 255 255 / 0.92);
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
    }

    main {
      display: grid;
      gap: 2.2rem;
    }

    h2 {
      margin: 0 0 0.9rem;
      color: #163b72;
      font-size: 0.86rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    a {
      color: var(--acento);
      font-weight: 650;
      text-underline-offset: 0.16em;
    }

    /* Una tarjeta por unidad, con el dibujo de su portada y su tono. Los
       dibujos son una copia de los que pinta la plantilla de las unidades
       (AGENTS.md, «Adornos temáticos»): al añadir una unidad se añade su
       tarjeta. */
    .rejilla-unidades {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr));
      gap: 1.5rem;
    }

    .tarjeta-unidad {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: inherit;
      font-weight: 400;
      text-decoration: none;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 1.1rem;
      box-shadow: 0 14px 34px rgb(22 59 114 / 0.1);
      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    /* Con una sola unidad, su tarjeta no se estira a todo el ancho. */
    .tarjeta-unidad:only-child {
      max-width: 34rem;
    }

    .tarjeta-unidad:focus-visible {
      outline: 3px solid var(--tono);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .tarjeta-unidad:hover {
        box-shadow: 0 18px 40px rgb(22 59 114 / 0.16);
        transform: translateY(-2px);
      }
    }

    .tono-azul {
      --tono: #1d4ed8;
      --lienzo:
        radial-gradient(circle at 88% 12%, rgb(255 255 255 / 0.2), transparent 32%),
        linear-gradient(120deg, #163b72 0%, #1d4ed8 68%, #4778de 100%);
    }

    .tono-violeta {
      --tono: #6d28d9;
      --lienzo:
        radial-gradient(circle at 88% 12%, rgb(255 255 255 / 0.2), transparent 32%),
        linear-gradient(120deg, #3b1a86 0%, #6d28d9 66%, #9a6cf2 100%);
    }

    .lienzo-tarjeta {
      display: block;
      flex: none;
      aspect-ratio: 640 / 225;
      color: #ffffff;
      background: var(--lienzo);
    }

    .lienzo-tarjeta svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lienzo-tarjeta .rotulos {
      font-family: "Times New Roman", Times, serif;
    }

    /* Con el ratón encima, o con el foco del teclado, el dibujo de la tarjeta
       se repliega y se vuelve a construir: una línea de luz lo recorre y cada
       pieza entra a su tiempo, hasta quedar exactamente como estaba. Solo
       CSS, sin guiones ni cargas: no pesa al abrir la página. No actúa en
       pantallas táctiles ni con el movimiento reducido. Cada pieza lleva en
       --t el instante en que entra y, si hace falta, en --d lo que dura. */
    .lienzo-tarjeta {
      overflow: hidden;
    }

    .lienzo-tarjeta svg,
    .lienzo-tarjeta .e-rejilla {
      transition: transform 1.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .lienzo-tarjeta .luz {
      opacity: 0;
    }

    .lienzo-tarjeta .e-copia {
      visibility: hidden;
    }

    .lienzo-tarjeta .e-destello {
      stroke-dasharray: 6 200;
      stroke-dashoffset: 6;
    }

    .lienzo-tarjeta .e-punto {
      transform-box: fill-box;
      transform-origin: center;
    }

    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      /* La cámara se acerca; la cuadrícula, más lejos, se acerca menos. */
      .tarjeta-unidad:is(:hover, :focus-visible) svg {
        transform: scale(1.05);
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-rejilla {
        transform: translate(9.6px, 3.4px) scale(0.97);
      }

      /* Dos animaciones por pieza: se retira enseguida y vuelve en su
         instante. La segunda no se adelanta: manda solo desde que empieza. */
      .tarjeta-unidad:is(:hover, :focus-visible) .e-punto {
        animation:
          t-sale 0.2s ease-in forwards,
          t-brota 0.5s cubic-bezier(0.34, 1.7, 0.5, 1) var(--t) forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-rotulo {
        animation:
          t-apaga 0.2s ease-in forwards,
          t-sube 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) var(--t) forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-letra {
        animation:
          t-apaga 0.2s ease-in forwards,
          t-letra 0.4s ease var(--t) forwards;
      }

      /* La fórmula de siempre se retira y la sustituye su copia troceada,
         factor a factor: trocear la original movería sus letras. */
      .tarjeta-unidad:is(:hover, :focus-visible) .e-fuera {
        animation: t-apaga 0.2s ease-in forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-copia {
        visibility: visible;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-factor {
        animation: t-letra 0.4s ease var(--t) both;
      }

      /* El cuadrado se traza desde el 0: el guion crece hasta su perímetro
         (4 × 96 = 384) y arranca en esa esquina (un lado de desfase). */
      .tarjeta-unidad:is(:hover, :focus-visible) .e-cuadro {
        stroke-dashoffset: 96;
        animation:
          t-sale 0.2s ease-in forwards,
          t-cuadro 0.55s ease-in-out var(--t) forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-diagonal {
        stroke-dasharray: 136;
        animation:
          t-sale 0.2s ease-in forwards,
          t-diagonal 0.38s ease-in-out var(--t) forwards;
      }

      /* El arco de puntos: los mismos puntos, seguidos de un hueco tan largo
         como el arco, para descubrirlos al paso del compás. */
      .tarjeta-unidad:is(:hover, :focus-visible) .e-arco {
        stroke-dasharray: 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 5.5 1.5 115;
        animation:
          t-sale 0.2s ease-in forwards,
          t-arco 0.62s cubic-bezier(0.45, 0, 0.25, 1) var(--t) forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-brazo {
        animation: t-brazo 0.62s cubic-bezier(0.45, 0, 0.25, 1) var(--t) forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-pliegue {
        animation: t-pliegue 1.15s forwards;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-eje {
        animation: t-eje 0.8s ease-out;
      }

      .tarjeta-unidad:is(:hover, :focus-visible) .e-destello {
        animation: t-destello var(--d) linear var(--t) forwards;
      }
    }

    @keyframes t-sale {
      to { opacity: 0; }
    }

    @keyframes t-apaga {
      to { fill-opacity: 0; stroke-opacity: 0; }
    }

    @keyframes t-brota {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes t-sube {
      from { fill-opacity: 0; stroke-opacity: 0; transform: translateY(8px); }
      to { fill-opacity: 1; stroke-opacity: 1; transform: translateY(0); }
    }

    @keyframes t-letra {
      from { fill-opacity: 0; stroke-opacity: 0; }
      to { fill-opacity: 1; stroke-opacity: 1; }
    }

    @keyframes t-cuadro {
      from { opacity: 1; fill-opacity: 0; stroke-dasharray: 0 384; }
      to { opacity: 1; fill-opacity: 0.07; stroke-dasharray: 384 0; }
    }

    @keyframes t-diagonal {
      from { opacity: 1; stroke-dashoffset: 136; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    @keyframes t-arco {
      from { opacity: 1; stroke-dashoffset: 106.63; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    /* El compás: la diagonal baja 45° hasta la recta, con centro en el 0. */
    @keyframes t-brazo {
      0% { opacity: 0; transform: rotate(0deg); }
      12% { opacity: 1; }
      82% { opacity: 1; }
      100% { opacity: 0; transform: rotate(45deg); }
    }

    /* La curva se pliega sobre el eje (y = 128) y se despliega con rebote:
       el traslado mantiene quieto el eje mientras la altura cambia. */
    @keyframes t-pliegue {
      0% { transform: translateY(0) scaleY(1); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.5); }
      16% { transform: translateY(125.44px) scaleY(0.02); animation-timing-function: cubic-bezier(0.15, 0.8, 0.3, 1); }
      62% { transform: translateY(-8.96px) scaleY(1.07); animation-timing-function: ease-in-out; }
      100% { transform: translateY(0) scaleY(1); }
    }

    @keyframes t-eje {
      30% { stroke-opacity: 1; stroke-width: 3.2; }
    }

    @keyframes t-destello {
      from { opacity: 1; stroke-dashoffset: 6; }
      to { opacity: 1; stroke-dashoffset: -100; }
    }

    .cuerpo-tarjeta {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 1.15rem 1.4rem 1.35rem;
    }

    .antetitulo {
      color: var(--tono);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .titulo-tarjeta {
      margin: 0.1rem 0 0.4rem;
      color: #111827;
      font-size: 1.55rem;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    .resumen {
      margin-bottom: 0.9rem;
      color: var(--texto-suave);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .fichas {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: auto;
    }

    .fichas span {
      padding: 0.22rem 0.7rem;
      color: #3b4a63;
      font-size: 0.8rem;
      font-weight: 700;
      background: #eef2f8;
      border-radius: 999px;
    }
  </style>
</head>
