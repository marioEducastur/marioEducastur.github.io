<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Matemáticas B — 4.º ESO</title>
  <style>
    :root {
      color-scheme: light;
      --texto: #182033;
      --texto-suave: #4b5568;
      --fondo: #f2f5fa;
      --superficie: #ffffff;
      --borde: #d6dce7;
      --acento: #2557a7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 68rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 6rem) clamp(1rem, 5vw, 3rem);
      color: var(--texto);
      background: var(--fondo);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      line-height: 1.65;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      max-width: 18ch;
      margin: 0 0 1rem;
      color: #111827;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .subtitulo {
      max-width: 48rem;
      margin: 0;
      color: var(--texto-suave);
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
    }

    main {
      display: grid;
      gap: 2.2rem;
    }

    h2 {
      margin: 0 0 0.9rem;
      color: #163b72;
      font-size: 0.86rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    a {
      color: var(--acento);
      font-weight: 650;
      text-underline-offset: 0.16em;
    }

    /* Una tarjeta por unidad, con el dibujo de su portada y su tono. Los
       dibujos son una copia de los que pinta la plantilla de las unidades
       (AGENTS.md, «Adornos temáticos»): al añadir una unidad se añade su
       tarjeta. */
    .rejilla-unidades {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr));
      gap: 1.5rem;
    }

    .tarjeta-unidad {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: inherit;
      font-weight: 400;
      text-decoration: none;
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 1.1rem;
      box-shadow: 0 14px 34px rgb(22 59 114 / 0.1);
      transition:
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    /* Con una sola unidad, su tarjeta no se estira a todo el ancho. */
    .tarjeta-unidad:only-child {
      max-width: 34rem;
    }

    .tarjeta-unidad:focus-visible {
      outline: 3px solid var(--tono);
      outline-offset: 3px;
    }

    @media (hover: hover) {
      .tarjeta-unidad:hover {
        box-shadow: 0 18px 40px rgb(22 59 114 / 0.16);
        transform: translateY(-2px);
      }
    }

    .tono-azul {
      --tono: #1d4ed8;
      --lienzo:
        radial-gradient(circle at 88% 12%, rgb(255 255 255 / 0.2), transparent 32%),
        linear-gradient(120deg, #163b72 0%, #1d4ed8 68%, #4778de 100%);
    }

    .tono-violeta {
      --tono: #6d28d9;
      --lienzo:
        radial-gradient(circle at 88% 12%, rgb(255 255 255 / 0.2), transparent 32%),
        linear-gradient(120deg, #3b1a86 0%, #6d28d9 66%, #9a6cf2 100%);
    }

    .lienzo-tarjeta {
      display: block;
      flex: none;
      aspect-ratio: 640 / 225;
      color: #ffffff;
      background: var(--lienzo);
    }

    .lienzo-tarjeta svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .lienzo-tarjeta .rotulos {
      font-family: "Times New Roman", Times, serif;
    }

    .cuerpo-tarjeta {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 1.15rem 1.4rem 1.35rem;
    }

    .antetitulo {
      color: var(--tono);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .titulo-tarjeta {
      margin: 0.1rem 0 0.4rem;
      color: #111827;
      font-size: 1.55rem;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    .resumen {
      margin-bottom: 0.9rem;
      color: var(--texto-suave);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .fichas {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: auto;
    }

    .fichas span {
      padding: 0.22rem 0.7rem;
      color: #3b4a63;
      font-size: 0.8rem;
      font-weight: 700;
      background: #eef2f8;
      border-radius: 999px;
    }
  </style>
</head>
