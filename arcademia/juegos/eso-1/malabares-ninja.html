<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#140f2e">
<title>Malabares Ninja · Arcademia</title>
<!--
  Juego: Malabares Ninja — el dojo de la divisibilidad
  Curso: 1.º ESO (útil también en 2.º) · Tema: Divisibilidad — criterios
  del 2, del 3 y del 5,
  división exacta por 7, números primos y compuestos, descomposición en
  factores primos y máximo común divisor (jefe «Los Gemelos»).
  Aprende esto en…: sin enlace todavía (la unidad de divisibilidad de 1.º
  ESO no tiene apuntes publicados).
  Origen: diseñado para Arcademia (2026-09-24) a partir de la ideación de
  1.º ESO del mismo día; autocontenido: canvas y WebAudio nativos, sin
  dependencias externas ni webfonts.
  Mecánica: los números vuelan como bolas de malabares. Se cortan
  arrastrando desde una cuchilla (2, 3, 5 o 7) hasta el número: si la
  cuchilla lo divide, cae una gema y el cociente sale relanzado; si no,
  suena un «clonk», la bola cae más deprisa y se agrieta. Los primos se
  atrapan con un toque. Cada número se fabrica como producto de primos con
  cuchilla por, a lo sumo, un primo menor que 100, así que siempre se puede
  terminar. Los Gemelos van encadenados: solo se cortan juntos, y la cadena
  se rompe cuando ya no comparten divisores; su producto es el m.c.d.
  Estructura: el bloque de script «logica» es lógica pura sin DOM
  (aritmética, cinturones, generador y motor de juego) y se ejecuta tal
  cual en jsc para el barrido de verificación; el bloque «interfaz» es el
  canvas, los mandos, el sonido y los paneles.
-->
<style>
:root{
  --noche:#140f2e; --noche-2:#231a4d; --panel:#1d1642; --panel-2:#2a2060; --borde:#3d3180;
  --tinta:#fdf6e3; --tinta-2:#cbc3ec; --oro:#ffc229; --oro-2:#ffd766; --rojo:#ff6b6b;
  --jade:#6ee7b7; --celeste:#74c0fc; --violeta:#b197fc;
  --g2:#ff6b6b; --g3:#4dabf7; --g5:#51cf66; --g7:#b197fc; --gg:#ffd43b;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --titulo: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%; overflow:hidden}
body{background:var(--noche); color:var(--tinta); font-family:var(--ui); user-select:none; -webkit-user-select:none; touch-action:manipulation}
#app{display:flex; flex-direction:column; height:100dvh; width:100%; max-width:640px; margin:0 auto; position:relative;
  background:radial-gradient(120% 60% at 50% 0%, #2b1f5e 0%, var(--noche) 70%)}

/* ---------- barra superior ---------- */
#superior{display:flex; align-items:center; gap:8px; padding:6px 8px; flex:0 0 auto; border-bottom:1px solid var(--borde);
  background:linear-gradient(#241a52, #19123b)}
#rotulo{display:flex; flex-direction:column; min-width:0; margin-right:auto; overflow:hidden}
#rotulo .n{font:700 10px/1.1 var(--ui); letter-spacing:.16em; text-transform:uppercase; color:var(--jade)}
#rotulo .t{font:900 18px/1.15 var(--titulo); letter-spacing:.06em; color:var(--oro); text-shadow:0 2px 0 #7a3b00, 0 0 10px rgba(255,194,41,.35); white-space:nowrap}
#botonera{display:flex; gap:6px}
.icobtn{width:38px; height:38px; border-radius:10px; border:2px solid var(--borde); background:#171036; color:var(--oro);
  font:800 16px var(--ui); display:grid; place-items:center; cursor:pointer; text-decoration:none; padding:0; box-shadow:0 2px 0 #0b0720}
.icobtn[aria-pressed="false"]{opacity:.55}
.icobtn:hover,.icobtn:focus-visible{background:var(--oro); color:#1d1642}

/* ---------- marcador ---------- */
#hud{display:grid; grid-template-columns:1.1fr .8fr 1fr 1.4fr; gap:4px; padding:4px 8px; flex:0 0 auto; background:#150f33; border-bottom:1px solid var(--borde)}
.celda{display:flex; flex-direction:column; align-items:center; min-width:0}
.celda .eti{font:700 9px/1.1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.celda .val{font:800 16px/1.25 var(--ui); color:var(--tinta); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
#hPuntos{color:var(--oro)}
#hCombo{color:var(--jade)}
#hCorazones{color:var(--rojo); letter-spacing:.06em}
#hCinturon{font-size:13px}
.val.destello{animation:destello .45s ease-out}
@keyframes destello{0%{transform:scale(1.25); filter:brightness(1.8)} 100%{transform:scale(1); filter:none}}

/* ---------- escenario ---------- */
#escenario{position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; overflow:hidden; padding:4px}
canvas{display:block; border-radius:10px; touch-action:none; box-shadow:0 0 0 1px var(--borde), 0 8px 24px rgba(0,0,0,.45)}
#banner{position:absolute; left:10px; right:10px; top:10px; text-align:center; pointer-events:none; opacity:0; transition:opacity .25s; z-index:2}
#banner.visible{opacity:1}
#banner .grande{font:900 20px/1.1 var(--titulo); color:var(--oro); letter-spacing:.04em; text-shadow:0 3px 0 #7a3b00, 0 0 14px rgba(255,194,41,.5)}
#banner .pista{margin-top:4px; font:600 12.5px/1.3 var(--ui); color:var(--tinta); background:rgba(20,15,46,.62); border:1px solid rgba(61,49,128,.7);
  border-radius:10px; padding:4px 9px; display:inline-block; max-width:100%; text-shadow:0 1px 2px #000}
#banner .pista b{color:var(--oro)}

/* ---------- cesta y marcador de la última jugada ---------- */
#cesta{flex:0 0 auto; padding:4px 8px 2px; background:#150f33; border-top:1px solid var(--borde)}
#ticker{font:700 14px/1.3 var(--ui); min-height:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--tinta)}
#ticker.bien{color:var(--jade)} #ticker.mal{color:#ffb3b3} #ticker.info{color:var(--tinta-2)} #ticker.jefe{color:var(--oro)}
#gemas{display:flex; align-items:center; gap:6px; margin-top:2px; min-height:24px}
#gemas .rot{font:700 10px var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--tinta-2)}
.gema{display:inline-flex; align-items:center; gap:3px; font:800 13px var(--ui); color:var(--tinta)}
.gema i{display:inline-grid; place-items:center; width:20px; height:20px; transform:rotate(45deg); border-radius:4px; font-style:normal}
.gema i span{transform:rotate(-45deg); font:900 11px var(--ui); color:#140f2e}
.gema.destello{animation:destello .45s ease-out}
#gGrandes{margin-left:auto; font:700 12px var(--ui); color:var(--gg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%}

/* ---------- cuchillas ---------- */
#mandos{flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:6px 8px 8px; background:#150f33}
#mandos.con-forja{grid-template-columns:repeat(5,1fr)}
.cuchilla{position:relative; border:2px solid var(--borde); border-radius:14px; background:linear-gradient(#2a2060,#1b1440); color:var(--oro);
  min-height:74px; padding:4px 2px 6px; cursor:pointer; touch-action:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  box-shadow:0 3px 0 #0b0720; min-width:0}
.cuchilla::before{content:""; position:absolute; left:6px; right:6px; top:0; height:4px; border-radius:0 0 4px 4px; background:var(--c)}
.cuchilla .num{font:900 28px/1 var(--titulo); color:var(--oro); text-shadow:0 2px 0 #7a3b00}
.cuchilla svg{width:30px; height:12px; display:block}
.cuchilla .crit{font:600 10px/1.15 var(--ui); color:var(--tinta-2); text-align:center; max-width:100%}
#mandos.sin-pistas .crit{display:none}
#mandos.sin-pistas .cuchilla{min-height:64px}
.cuchilla:hover,.cuchilla:focus-visible{border-color:var(--oro)}
.cuchilla[aria-pressed="true"]{background:linear-gradient(#ffd766,#ffb300); border-color:#fff}
.cuchilla[aria-pressed="true"] .num{color:#1d1642; text-shadow:none}
.cuchilla[aria-pressed="true"] .crit{color:#2a1f00}
.cuchilla[aria-disabled="true"]{opacity:.4; cursor:not-allowed}
#bForja{border-color:var(--oro); background:linear-gradient(#5a3a10,#2e1c06)}
#bForja .num{font-size:22px}
#bForja[hidden]{display:none}

/* ---------- panel de la forja ---------- */
#forja{position:absolute; left:0; right:0; bottom:0; z-index:4; background:#1b1440; border-top:2px solid var(--oro); padding:8px 10px 10px;
  display:flex; flex-direction:column; gap:6px; max-height:min(62%, 330px); overflow-y:auto; box-shadow:0 -8px 20px rgba(0,0,0,.5)}
#forja[hidden]{display:none}
#forja > *{flex:0 0 auto}
#forjaTitulo{font:800 12px var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--oro)}
#forjaGemelos{font:600 13px/1.35 var(--ui); color:var(--tinta-2)}
#forjaValor{font:900 20px/1.3 var(--ui); color:#fff; background:#100b28; border:1px solid var(--borde); border-radius:10px; padding:4px 10px; overflow-x:auto; white-space:nowrap}
#forjaGemas{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
#forjaBotones{display:flex; gap:6px}
#forjaMedidor{height:5px; background:#100b28; border-radius:3px; overflow:hidden}
#forjaMedidorBarra{height:100%; width:100%; background:linear-gradient(90deg, var(--oro), var(--rojo))}

/* ---------- botones y paneles ---------- */
.btn{flex:1 1 auto; border:2px solid var(--borde); border-radius:12px; background:#171036; color:var(--oro); font:800 14px var(--ui);
  padding:8px 10px; cursor:pointer; min-height:40px}
.btn:hover,.btn:focus-visible{background:var(--oro); color:#1d1642}
.btn.secundario{color:var(--tinta-2)}
.btn.principal{background:var(--oro); color:#1d1642; border-color:var(--oro)}
.btn.principal:hover,.btn.principal:focus-visible{background:var(--oro-2); color:#1d1642}
.btn[aria-pressed="true"]{background:var(--jade); color:#0e2a20; border-color:var(--jade)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.gema-btn{display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--tinta)}
.btn.gema-btn b{font:900 20px var(--ui); color:var(--c)}
.btn.gema-btn small{font:700 11px var(--ui); color:var(--tinta-2)}
.btn.gema-btn:hover b,.btn.gema-btn:focus-visible b,.btn.gema-btn:hover small,.btn.gema-btn:focus-visible small{color:#1d1642}
#aviso{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
#velo{position:absolute; inset:0; background:rgba(8,5,24,.86); display:flex; align-items:center; justify-content:center; padding:12px; z-index:10; overflow:auto}
#velo[hidden]{display:none}
.panel{width:100%; max-width:470px; background:var(--panel); border:2px solid var(--oro); border-radius:18px; padding:16px;
  box-shadow:0 0 26px rgba(255,194,41,.22); max-height:100%; overflow:auto}
.panel h2{margin:0 0 6px; font:900 24px/1.1 var(--titulo); letter-spacing:.04em; color:var(--oro); text-align:center; text-shadow:0 3px 0 #7a3b00}
.panel h3{margin:12px 0 4px; font:800 12px var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--jade)}
.panel p{margin:6px 0; font:500 14px/1.45 var(--ui); color:var(--tinta)}
.panel .sub{text-align:center; color:var(--tinta-2); font-size:13px}
.panel .fila{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.panel .fila .btn{flex:1 1 140px}
.panel ul{margin:4px 0; padding-left:18px; font:500 13px/1.45 var(--ui)}
.panel li{margin:3px 0}
.panel b{color:var(--oro)}
.panel .cifra{font:900 34px/1.1 var(--titulo); color:var(--oro); text-align:center; margin:6px 0}
.panel .recor{font:700 13px/1.4 var(--ui); color:var(--tinta-2); text-align:center; margin-top:8px}
.panel .aviso-sesion{font:800 13px/1.4 var(--ui); color:var(--jade); text-align:center; margin-top:6px}
.cinturones{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px}
.cinturones .btn{padding:6px 2px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0}
.cinturones .btn .cinta{display:block; width:26px; height:8px; border-radius:3px; background:var(--c); border:1px solid rgba(255,255,255,.5)}
.tabla{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font:500 13px/1.4 var(--ui); margin:6px 0}
.tabla b{font:800 13px var(--ui); color:var(--oro); text-align:right}
.pie-marca{margin-top:12px; text-align:center; font:600 12px var(--ui); color:var(--tinta-2)}
.pie-marca a{color:var(--jade)}
.icobtn:focus-visible,.cuchilla:focus-visible,.btn:focus-visible,.pie-marca a:focus-visible{outline:3px solid #ffffff; outline-offset:2px}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
@media (max-width:400px){ #rotulo .t{font-size:15px; letter-spacing:.02em} #rotulo .n{font-size:9px} }
@media (max-height:620px){ .cuchilla{min-height:60px} .cuchilla .num{font-size:24px} #hud .val{font-size:14px} }
@media (min-width:600px){ .cuchilla{min-height:84px} }
</style>
</head>
<body>
<div id="app">
  <header id="superior">
    <a class="icobtn" id="bVolver" href="../../index.html" aria-label="Volver al salón Arcademia" title="Volver a Arcademia">←</a>
    <div id="rotulo"><span class="n">Números · 1.º y 2.º ESO</span><span class="t">MALABARES NINJA</span></div>

      <button type="button" class="icobtn" id="bSonido" aria-pressed="true" aria-label="Sonido" title="Sonido (M)">🔊</button>

  <div id="escenario">

      <span class="gema" id="g3" style="--c:var(--g3)" role="img" aria-label="Gemas del 3"><i style="background:var(--g3)" aria-hidden="true"><span>3</span></i><span class="cuenta" id="g3c">×0</span></span>

    <button type="button" class="cuchilla" data-p="3" style="--c:var(--g3)" aria-pressed="false" aria-keyshortcuts="3" aria-label="Cuchilla del 3"><span class="num">3</span><svg viewBox="0 0 60 24" aria-hidden="true"><path d="M2 12 L40 4 L58 12 L40 20 Z" fill="#dfe6ff"/><rect x="0" y="9" width="10" height="6" rx="2" fill="#8a5a2c"/></svg><span class="crit">sus cifras suman un múltiplo de 3</span></button>
    <button type="button" class="cuchilla" data-p="5" style="--c:var(--g5)" aria-pressed="false" aria-keyshortcuts="5" aria-label="Cuchilla del 5"><span class="num">5</span><svg viewBox="0 0 60 24" aria-hidden="true"><path d="M2 12 L40 4 L58 12 L40 20 Z" fill="#dfe6ff"/><rect x="0" y="9" width="10" height="6" rx="2" fill="#8a5a2c"/></svg><span class="crit">acaba en 0 o en 5</span></button>
    <button type="button" class="cuchilla" data-p="7" style="--c:var(--g7)" aria-pressed="false" aria-keyshortcuts="7" aria-label="Cuchilla del 7"><span class="num">7</span><svg viewBox="0 0 60 24" aria-hidden="true"><path d="M2 12 L40 4 L58 12 L40 20 Z" fill="#dfe6ff"/><rect x="0" y="9" width="10" height="6" rx="2" fill="#8a5a2c"/></svg><span class="crit">haz la división</span></button>
    <button type="button" class="cuchilla" id="bForja" hidden aria-keyshortcuts="F" aria-label="Forja: combina gemas de la cesta en una cuchilla para los Gemelos"><span class="num">⚒</span><span class="crit">forja (F)</span></button>
  </div>

  <div id="forja" hidden role="group" aria-labelledby="forjaTitulo">
    <div id="forjaTitulo">Forja · el tiempo se congela</div>
    <div id="forjaGemelos"></div>

      <button type="button" class="btn secundario" id="bForjaQuitar">Quitar (⌫)</button>

  <div id="velo"><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitulo"></div></div>
</div>

<script id="logica">
/* @@LOGICA-INICIO — lógica pura de Malabares Ninja, sin DOM (se ejecuta tal cual en jsc) */
var MALABARES = (function(){
"use strict";
/* mundo: 10 de ancho por 12 de alto, y hacia arriba; el suelo de madera llega hasta y = 0,8 */
var W = 10, H = 12, SUELO = 0.8, R = 0.72, R_JEFE = 0.8, SEP_JEFE = 1.05;
var LANZA_X = 5, LANZA_Y = 2.0;
var CUCHILLAS = [2, 3, 5, 7];
var PRIMO_MAX = 97;               /* el único factor que no se corta es un primo menor que 100 */
var GRIETAS_MAX = 3;              /* tres cortes que no dividen rompen la bola */
var CONGELACION_FORJA = 10;       /* segundos de tiempo congelado al abrir la forja */
var FACTOR_TRANQUILO = 0.65;      /* el modo tranquilo reduce la gravedad */
var SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

/* ---------- aritmética ---------- */
function esPrimo(n){
  if(n < 2 || n !== Math.floor(n)) return false;
  if(n % 2 === 0) return n === 2;
  for(var d = 3; d * d <= n; d += 2) if(n % d === 0) return false;
  return true;
}
function factoriza(n){
  var f = [], d = 2;
  while(n > 1 && d * d <= n){
    var e = 0; while(n % d === 0){ n /= d; e++; }
    if(e) f.push([d, e]);
    d += (d === 2 ? 1 : 2);
  }
  if(n > 1) f.push([n, 1]);
  return f;
}
function omega(n){ var s = 0, f = factoriza(n); for(var i = 0; i < f.length; i++) s += f[i][1]; return s; }
function exponente(e){ return String(e).split('').map(function(c){ return SUP[c]; }).join(''); }
function textoFactorizacion(n){
  if(n === 1) return '1';
  return factoriza(n).map(function(f){ return f[1] > 1 ? f[0] + exponente(f[1]) : String(f[0]); }).join('·');
}
function mcd(a, b){ a = Math.abs(a); b = Math.abs(b); while(b){ var t = a % b; a = b; b = t; } return a; }
function sumaCifras(n){ var s = 0; String(n).split('').forEach(function(c){ s += +c; }); return s; }
function fmtPuntos(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function categoria(n){ if(esPrimo(n)) return 'primo'; if(n % 2 !== 0 && n % 5 !== 0) return 'impostor'; return 'otro'; }

/* la lección de cada corte que no divide, con el criterio de divisibilidad de 1.º ESO */
function porQueNoDivide(n, d){
  if(n < d) return d + ' no divide a ' + n + ': ' + n + ' es menor que ' + d + '.';
  if(d === 2) return '2 no divide a ' + n + ': acaba en ' + (n % 10) + ', que es impar.';
  if(d === 3){
    if(n < 10) return '3 no divide a ' + n + ': ' + n + ' no es múltiplo de 3.';
    var cs = String(n).split('');
    return '3 no divide a ' + n + ': ' + cs.join(' + ') + ' = ' + sumaCifras(n) + ', que no es múltiplo de 3.';
  }
  if(d === 5) return '5 no divide a ' + n + ': no acaba en 0 ni en 5.';
  var q = Math.floor(n / d), r = n % d;
  return d + ' no divide a ' + n + ': ' + n + ' = ' + d + '·' + q + ' + ' + r + '.';
}

/* ---------- cinturones ---------- */
var CINTURONES = [
  { id:'blanco',   nombre:'Cinturón blanco',   cuchillas:[2,3,5],   max:60,  omegaMax:3, bolas:10, faciles:2, simultaneas:1, intervalo:0,   g:3.0,

  { id:'amarillo', nombre:'Cinturón amarillo', cuchillas:[2,3,5],   max:120, omegaMax:4, bolas:12, faciles:0, simultaneas:1, intervalo:0,   g:3.3,
    pesos:{primo:0.25, impostor:0.25}, jefe:{ mcds:[6,10,12,15,18,20], maxPar:100, omegaLibre:2 } },
  { id:'naranja',  nombre:'Cinturón naranja',  cuchillas:[2,3,5,7], max:250, omegaMax:4, bolas:12, faciles:0, simultaneas:1, intervalo:0,   g:3.4,

  { id:'verde',    nombre:'Cinturón verde',    cuchillas:[2,3,5,7], max:500, omegaMax:5, bolas:14, faciles:0, simultaneas:2, intervalo:8,   g:3.2,
    pesos:{primo:0.2, impostor:0.35}, jefe:{ mcds:[12,14,18,20,21,24,28,30,35,36,42], maxPar:400, omegaLibre:3 }, dosBolas:true },
  { id:'negro',    nombre:'Cinturón negro',    cuchillas:[2,3,5,7], max:999, omegaMax:6, bolas:14, faciles:0, simultaneas:2, intervalo:6.5, g:3.5,

];
var RETO = { id:'reto', nombre:'Reto del día', cuchillas:[2,3,5,7], max:300, omegaMax:5, bolas:15, faciles:0, simultaneas:1, intervalo:0, g:3.4,
  pesos:{primo:0.2, impostor:0.35}, jefe:{ mcds:[12,14,18,20,21,28,30,42], maxPar:300, omegaLibre:2 } };

/* conjunto de números de una configuración: n = (producto de primos con cuchilla) · q, con q = 1 o un primo sin cuchilla menor que 100 */
var cachePool = {};
function poolDe(c){
  if(cachePool[c.id]) return cachePool[c.id];
  var todos = [], primo = [], impostor = [], otro = [];
  for(var n = 2; n <= c.max; n++){
    if(omega(n) > c.omegaMax) continue;
    var resto = n;
    for(var i = 0; i < c.cuchillas.length; i++){ var p = c.cuchillas[i]; while(resto % p === 0) resto /= p; }
    if(!(resto === 1 || (esPrimo(resto) && resto <= PRIMO_MAX))) continue;
    todos.push(n);
    var cat = categoria(n);
    if(cat === 'primo'){ if(n >= 7) primo.push(n); }
    else if(cat === 'impostor') impostor.push(n);
    else otro.push(n);
  }
  cachePool[c.id] = { todos:todos, primo:primo, impostor:impostor, otro:otro };
  return cachePool[c.id];
}
function barajar(arr, rng){ for(var i = arr.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
function tomar(lista, k, rng){ var copia = barajar(lista.slice(), rng), out = []; for(var i = 0; i < k; i++) out.push(copia[i % copia.length]); return out; }
function generarSecuencia(c, semilla){
  var rng = mulberry32((semilla >>> 0) || 1), P = poolDe(c), n = c.bolas, fac = c.faciles || 0, libres = n - fac;
  var nPrimo = Math.round(libres * c.pesos.primo), nImp = Math.round(libres * c.pesos.impostor), nOtro = libres - nPrimo - nImp;
  var faciles = tomar(P.otro.filter(function(x){ return x <= 20 && x % 2 === 0; }), fac, rng);
  var otros = P.otro.filter(function(x){ return faciles.indexOf(x) < 0; });
  var resto = tomar(P.primo, nPrimo, rng).concat(tomar(P.impostor, nImp, rng), tomar(otros, nOtro, rng));
  barajar(resto, rng);
  return faciles.concat(resto);
}
/* jefe «Los Gemelos»: a = g·x y b = g·y con m.c.d.(x, y) = 1, así que m.c.d.(a, b) = g */
function generarJefe(c, semilla){
  if(!c.jefe) return null;
  var rng = mulberry32(((semilla >>> 0) ^ 0x5bd1e995) >>> 0 || 7), P = poolDe(c).todos;
  for(var t = 0; t < 4000; t++){
    var g = c.jefe.mcds[Math.floor(rng() * c.jefe.mcds.length)];
    var cand = P.filter(function(x){ return g * x <= c.jefe.maxPar && omega(x) <= (c.jefe.omegaLibre || 3); });
    if(cand.length < 2) continue;
    var x = cand[Math.floor(rng() * cand.length)], y = cand[Math.floor(rng() * cand.length)];
    if(x === y || mcd(x, y) !== 1) continue;
    return { a:g * x, b:g * y, g:g, x:x, y:y };
  }
  return null;
}

/* ---------- geometría de toques y tajos ---------- */
function tCirculo(x0, y0, x1, y1, cx, cy, rad){
  var dx = x1 - x0, dy = y1 - y0, fx = x0 - cx, fy = y0 - cy;
  var a = dx * dx + dy * dy, b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - rad * rad;
  if(c <= 0) return 0;
  if(a < 1e-12) return -1;
  var disc = b * b - 4 * a * c; if(disc < 0) return -1;
  var t = (-b - Math.sqrt(disc)) / (2 * a);
  return (t >= 0 && t <= 1) ? t : -1;
}

/* ---------- motor ---------- */
function crearMotor(){
  var M = { eventos:[], bolas:[], jefe:null, cola:[], fase:'menu', modo:'campana', tranquilo:false, semilla:1,
            cinturon:0, config:CINTURONES[0], puntos:0, corazones:3, combo:0, comboMax:0, cesta:{2:0,3:0,5:0,7:0}, grandes:[],
            forja:null, tiempo:0, intentos:0, estad:null };
  var rng = mulberry32(1), multAnterior = 1, siguienteId = 1;
  function emitir(tipo, datos){ var e = datos || {}; e.tipo = tipo; M.eventos.push(e); return e; }
  function gravedad(esJefe){ var g = M.config.g * (M.tranquilo ? FACTOR_TRANQUILO : 1); return esJefe ? g * 0.8 : g; }
  function simultaneas(){ return M.tranquilo ? 1 : M.config.simultaneas; }
  function mult(){ return Math.min(4, 1 + Math.floor(M.combo / 3)); }
  M.mult = mult;
  function subirCombo(){ M.combo++; if(M.combo > M.comboMax) M.comboMax = M.combo; var m = mult(); if(m > multAnterior) emitir('combo', { mult:m }); multAnterior = m; }
  function romperCombo(){ if(M.combo >= 3) emitir('comboRoto', { combo:M.combo }); M.combo = 0; multAnterior = 1; }
  function estadNueva(){ return { cortes:0, clonks:0, primos:0, impostores:0, erroresPrimo:0, caidas:0, rotas:0, completadas:0, cadenas:0, tajosMaestros:0, corazonesPerdidos:0 }; }
  function buscar(id){ for(var i = 0; i < M.bolas.length; i++) if(M.bolas[i].id === id) return M.bolas[i]; return null; }
  function quitar(b){ var i = M.bolas.indexOf(b); if(i >= 0) M.bolas.splice(i, 1); }
  function copiaCesta(c){ return { 2:c[2], 3:c[3], 5:c[5], 7:c[7] }; }

  M.nuevaPartida = function(modo, op){
    op = op || {};
    M.modo = modo || 'campana'; M.tranquilo = !!op.tranquilo; M.semilla = (op.semilla >>> 0) || 1;
    M.puntos = 0; M.cesta = {2:0,3:0,5:0,7:0}; M.grandes = []; M.combo = 0; M.comboMax = 0; multAnterior = 1; M.intentos = 0;
    M.estad = estadNueva(); M.eventos.length = 0;
    M.cargarEtapa(M.modo === 'campana' ? (op.cinturon || 0) : -1);
  };
  M.cargarEtapa = function(indice){
    var c = (M.modo === 'campana') ? CINTURONES[indice] : RETO;
    M.config = c; M.cinturon = indice;
    var sem = ((M.semilla + (indice + 2) * 104729 + M.intentos * 7919) >>> 0) || 3;
    M.cola = generarSecuencia(c, sem); M.totalBolas = M.cola.length;
    M.jefePendiente = generarJefe(c, sem); M.jefe = null; M.bolas = []; M.forja = null;
    M.corazones = 3; M.combo = 0; multAnterior = 1;
    M.puntosInicioEtapa = M.puntos; M.cestaInicioEtapa = copiaCesta(M.cesta); M.grandesInicioEtapa = M.grandes.slice();
    M.tiempo = 0; M.tUltimo = -99; M.retrasoInicio = 2.0; M.tJefe = -1;
    rng = mulberry32(((sem ^ 0x9e3779b9) >>> 0) || 5);
    M.fase = 'jugando';
    emitir('etapa', { indice:indice, config:c, jefe:!!M.jefePendiente, nuevaCuchilla:c.nuevaCuchilla || null, reintento:M.intentos > 0, modo:M.modo });
  };
  M.reintentar = function(){
    if(M.fase !== 'fallo') return false;
    M.puntos = M.puntosInicioEtapa; M.cesta = copiaCesta(M.cestaInicioEtapa); M.grandes = M.grandesInicioEtapa.slice();
    M.intentos++; M.cargarEtapa(M.cinturon); return true;
  };

  function lanzar(n){
    var b = { id:siguienteId++, n:n, n0:n, x:LANZA_X + (rng() - 0.5) * 0.8, y:LANZA_Y, r:R, grietas:0, clonks:0, cortes:[], gemelo:false };
    var g = gravedad(false), pico = 9.2 + rng() * 1.2;
    b.vy = Math.sqrt(2 * g * (pico - b.y));
    var xObjetivo = 1.8 + rng() * 6.4;
    b.vx = (xObjetivo - b.x) / (b.vy / g);
    M.bolas.push(b); M.tUltimo = M.tiempo;
    emitir('lanzamiento', { id:b.id, n:n, x:b.x, y:b.y });
  }
  function lanzarJefe(j){
    var g = gravedad(true);
    var J = { id:'jefe', a:j.a, b:j.b, a0:j.a, b0:j.b, g0:j.g, x:W / 2, y:LANZA_Y + 0.3, r:R_JEFE, cadena:[], encadenado:true, clonks:0 };
    J.vy = Math.sqrt(2 * g * (9.6 - J.y)); J.vx = (rng() - 0.5) * 0.6;
    M.jefe = J;
    emitir('jefeEntra', { a:J.a, b:J.b, eslabones:omega(mcd(J.a, J.b)) });
  }
  function relanzar(b, esJefe){
    var g = gravedad(esJefe), tope = H - b.r - 0.3;
    var pico = Math.min(Math.max(b.y + 3.2, 7.2), tope);
    if(pico < b.y + 0.2) pico = Math.min(b.y + 0.2, H - b.r);
    b.vy = Math.sqrt(Math.max(0, 2 * g * (pico - b.y)));
    b.vx = b.vx * 0.5 + (W / 2 - b.x) * 0.12 + (rng() - 0.5) * 0.6;
  }
  function mover(b, g, dt, sep){
    b.vy -= g * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    var minX = b.r + (sep || 0), maxX = W - b.r - (sep || 0);
    if(b.x < minX){ b.x = minX; b.vx = Math.abs(b.vx) * 0.8; }
    if(b.x > maxX){ b.x = maxX; b.vx = -Math.abs(b.vx) * 0.8; }
    if(b.y > H - b.r){ b.y = H - b.r; if(b.vy > 0) b.vy = 0; }
  }
  function perderCorazon(motivo){
    M.corazones--; M.estad.corazonesPerdidos++;
    emitir('corazon', { corazones:M.corazones, motivo:motivo });
    if(M.corazones <= 0) derrota();
  }
  function derrota(){
    M.bolas = []; M.jefe = null; M.forja = null; M.cola = []; M.jefePendiente = null;
    if(M.modo === 'campana'){ M.fase = 'fallo'; emitir('fallo', { indice:M.cinturon, puntos:M.puntos }); }
    else { M.fase = 'fin'; emitir('fin', { puntos:M.puntos, completo:false }); }
  }
  function completar(b, como){
    quitar(b);
    var pts = 20 * omega(b.n0) * mult(), extras = [];
    if(como === 'atrapada' && esPrimo(b.n0) && b.clonks === 0){ pts += 30; extras.push('primo'); }
    if(categoria(b.n0) === 'impostor'){ pts += 50; extras.push('impostor'); M.estad.impostores++; }
    M.puntos += pts; M.estad.completadas++;
    emitir('completada', { id:b.id, n0:b.n0, fact:textoFactorizacion(b.n0), como:como, x:b.x, y:b.y, puntos:pts, extras:extras, gemelo:b.gemelo });
  }
  function etapaSuperada(){
    var bonus = 100 * M.corazones; M.puntos += bonus;
    M.fase = 'transicion'; M.tTransicion = 3.2;
    var ultima = (M.modo !== 'campana') || (M.cinturon >= CINTURONES.length - 1);
    emitir('etapaSuperada', { indice:M.cinturon, bonus:bonus, corazones:M.corazones, ultima:ultima, modo:M.modo });
  }
  function siguiente(){
    if(M.modo === 'campana' && M.cinturon < CINTURONES.length - 1){ M.intentos = 0; M.cargarEtapa(M.cinturon + 1); }
    else if(M.modo === 'campana'){ M.fase = 'victoria'; emitir('victoria', { puntos:M.puntos }); }
    else { M.fase = 'fin'; emitir('fin', { puntos:M.puntos, completo:true }); }
  }

  /* acciones del jugador */
  M.cortar = function(id, p){
    if(M.fase !== 'jugando') return { ok:false, motivo:'fase' };
    if(CUCHILLAS.indexOf(p) < 0) return { ok:false, motivo:'cuchilla' };
    if(M.config.cuchillas.indexOf(p) < 0){ emitir('cuchillaBloqueada', { p:p }); return { ok:false, motivo:'bloqueada' }; }
    if(id === 'jefe') return cortarCadena(p);
    var b = buscar(id); if(!b) return { ok:false, motivo:'sin-bola' };
    if(b.n % p === 0){
      var antes = b.n; b.n = antes / p; b.cortes.push(p); M.cesta[p]++; M.estad.cortes++;
      subirCombo(); var pts = 10 * mult(); M.puntos += pts;
      emitir('corte', { id:b.id, antes:antes, p:p, despues:b.n, x:b.x, y:b.y, puntos:pts });
      if(b.n === 1) completar(b, 'uno');
      else { b.grietas = 0; relanzar(b, b.gemelo); }
      return { ok:true, despues:b.n };
    }
    b.clonks++; M.estad.clonks++; romperCombo();
    b.vy = Math.min(b.vy, 0) - 1.5;
    var cuenta = (p !== 7);
    if(cuenta) b.grietas++;
    emitir('clonk', { id:b.id, n:b.n, p:p, x:b.x, y:b.y, grietas:b.grietas, cuenta:cuenta, porque:porQueNoDivide(b.n, p), esPrimo:esPrimo(b.n) });
    if(b.grietas >= GRIETAS_MAX){
      quitar(b); M.estad.rotas++;
      emitir('rota', { id:b.id, n:b.n, n0:b.n0, x:b.x, y:b.y, fact:textoFactorizacion(b.n), esPrimo:esPrimo(b.n) });
      perderCorazon('rota');
    }
    return { ok:false, motivo:'no-divide' };
  };
  M.atrapar = function(id){
    if(M.fase !== 'jugando') return { ok:false, motivo:'fase' };
    if(id === 'jefe'){ if(M.jefe) emitir('jefeNoSeAtrapa', { a:M.jefe.a, b:M.jefe.b }); return { ok:false, motivo:'jefe' }; }
    var b = buscar(id); if(!b) return { ok:false, motivo:'sin-bola' };
    if(esPrimo(b.n)){
      if(b.n <= 7) M.cesta[b.n]++; else M.grandes.push(b.n);
      b.cortes.push(b.n); M.estad.primos++; subirCombo();
      emitir('atrapada', { id:b.id, n:b.n, x:b.x, y:b.y });
      completar(b, 'atrapada');
      return { ok:true };
    }
    quitar(b); romperCombo(); M.estad.erroresPrimo++;
    emitir('errorPrimo', { id:b.id, n:b.n, n0:b.n0, x:b.x, y:b.y, fact:textoFactorizacion(b.n) });
    perderCorazon('errorPrimo');
    return { ok:false, motivo:'compuesto' };
  };
  function cortarCadena(p){
    var J = M.jefe; if(!J || !J.encadenado) return { ok:false, motivo:'sin-jefe' };
    if(J.a % p === 0 && J.b % p === 0){
      var a = J.a, b = J.b; J.a /= p; J.b /= p; J.cadena.push(p); M.cesta[p]++; M.estad.cortes++;
      subirCombo(); var pts = 20 * mult(); M.puntos += pts;
      relanzar(J, true);
      var queda = mcd(J.a, J.b);
      emitir('cadenaCorte', { p:p, antesA:a, antesB:b, a:J.a, b:J.b, eslabones:omega(queda), puntos:pts, x:J.x, y:J.y });
      if(queda === 1) romperCadena(false);
      return { ok:true };
    }
    J.clonks++; M.estad.clonks++; romperCombo(); J.vy = Math.min(J.vy, 0) - 1.2;
    emitir('cadenaClonk', { p:p, a:J.a, b:J.b, divideA:J.a % p === 0, divideB:J.b % p === 0, x:J.x, y:J.y });
    return { ok:false, motivo:'no-divide' };
  }
  function romperCadena(maestro){
    var J = M.jefe, g = J.a0 / J.a;
    M.estad.cadenas++; if(maestro) M.estad.tajosMaestros++;
    var pts = (maestro ? 300 : 100) * mult(); M.puntos += pts;
    emitir('cadenaRota', { a0:J.a0, b0:J.b0, mcd:g, fact:textoFactorizacion(g), maestro:maestro, a:J.a, b:J.b, x:J.x, y:J.y, puntos:pts });
    var lados = [[J.a, -1], [J.b, 1]];
    for(var i = 0; i < 2; i++){
      var n = lados[i][0], s = lados[i][1];
      var bola = { id:siguienteId++, n:n, n0:n, x:Math.min(W - R, Math.max(R, J.x + s * SEP_JEFE)), y:J.y, r:R, grietas:0, clonks:0, cortes:[], gemelo:true, vx:s * 1.2, vy:0, pausa:1.2 };
      var gG = gravedad(true), picoG = Math.min(Math.max(J.y + 2.5, 9.4), H - R - 0.3);
      bola.vy = Math.sqrt(Math.max(0, 2 * gG * (picoG - bola.y)));
      M.bolas.push(bola);
    }
    M.jefe = null; M.forja = null; if(M.fase === 'forja') M.fase = 'jugando';
  }
  M.abrirForja = function(){
    if(M.fase !== 'jugando' || !M.jefe || !M.jefe.encadenado) return { ok:false, motivo:'sin-jefe' };
    M.fase = 'forja'; M.forja = { gemas:[], congelacion:CONGELACION_FORJA, caducada:false };
    emitir('forja', {}); return { ok:true };
  };
  M.valorForja = function(){ if(!M.forja) return 1; return M.forja.gemas.reduce(function(a, p){ return a * p; }, 1); };
  M.gemasLibres = function(p){ var usadas = M.forja ? M.forja.gemas.filter(function(q){ return q === p; }).length : 0; return M.cesta[p] - usadas; };
  M.forjaAnadir = function(p){
    if(M.fase !== 'forja') return { ok:false, motivo:'fase' };
    if(CUCHILLAS.indexOf(p) < 0) return { ok:false, motivo:'gema' };
    if(M.gemasLibres(p) <= 0) return { ok:false, motivo:'sin-gemas' };
    if(M.valorForja() * p > 999) return { ok:false, motivo:'grande' };
    M.forja.gemas.push(p); return { ok:true, valor:M.valorForja() };
  };
  M.forjaQuitar = function(){ if(M.fase !== 'forja' || !M.forja.gemas.length) return { ok:false }; M.forja.gemas.pop(); return { ok:true, valor:M.valorForja() }; };
  M.forjaCancelar = function(){ if(M.fase !== 'forja') return { ok:false }; M.fase = 'jugando'; M.forja = null; emitir('forjaCancelada', {}); return { ok:true }; };
  M.forjaLanzar = function(){

/* ---------------- objetivo (teclado) ---------------- */
function objetivoActual(){
  var L = M.cuerpos();
  if(UI.objetivo !== null && L.some(function(c){ return c.id === UI.objetivo; })) return UI.objetivo;
  return M.masBajo();
}
function cambiarObjetivo(dir){
  var L = M.cuerpos().sort(function(a, b){ return a.x - b.x; }); if(!L.length) return;
  var actual = objetivoActual(), i = -1;
  for(var k = 0; k < L.length; k++) if(L[k].id === actual) i = k;
  var sig = L[(i + dir + L.length) % L.length];
  UI.objetivo = sig.id; UI.teclado = true;
  anunciar('Objetivo: ' + (sig.id === 'jefe' ? 'los Gemelos ' + sig.a + ' y ' + sig.b : 'el ' + sig.n) + '.');
}
function alturaTexto(y){ return y > 7.5 ? 'alto' : (y > 4 ? 'a media altura' : 'bajo'); }
function anunciarAire(){
  var L = M.cuerpos().sort(function(a, b){ return a.x - b.x; });
  if(!L.length){ anunciar('No hay ningún número en el aire.'); return; }
  anunciar('En el aire: ' + L.map(function(c){ return (c.id === 'jefe' ? 'los Gemelos ' + c.a + ' y ' + c.b : 'el ' + c.n) + ', ' + alturaTexto(c.y); }).join('; ') + '.');
}

/* ---------------- acciones ---------------- */

  M.cortar(id, p); procesarEventos();
}
function ejecutarAtrapar(id){ if(!jugable()) return; M.atrapar(id); procesarEventos(); }
function alternarArmada(p){

  UI.armada = (UI.armada === p) ? null : p;
  actualizarCuchillas();

}
function actualizarCuchillas(){
  Array.prototype.forEach.call(document.querySelectorAll('.cuchilla[data-p]'), function(b){

/* ---------------- entrada: cortes arrastrando desde una cuchilla ---------------- */
function anadirEstela(w){ UI.estela.push({ x:w[0], y:w[1], t:UI.reloj }); if(UI.estela.length > 40) UI.estela.shift(); }
Array.prototype.forEach.call(document.querySelectorAll('.cuchilla[data-p]'), function(boton){
  var p = +boton.getAttribute('data-p');
  boton.addEventListener('pointerdown', function(ev){
    Sonido.despertar(); UI.teclado = false;
    if(!jugable()) return;
    ev.preventDefault();
    try{ boton.setPointerCapture(ev.pointerId); }catch(e){}
    UI.corte = { p:p, id:ev.pointerId, x0:ev.clientX, y0:ev.clientY, ultimo:null, movido:false, hecho:false };
  });
  boton.addEventListener('pointermove', function(ev){
    var c = UI.corte; if(!c || c.id !== ev.pointerId) return;
    if(!c.movido && Math.hypot(ev.clientX - c.x0, ev.clientY - c.y0) > 10) c.movido = true;
    if(c.hecho || !c.movido) return;
    var w = aMundo(ev.clientX, ev.clientY);
    if(c.ultimo){
      var id = M.cruce(c.ultimo[0], c.ultimo[1], w[0], w[1], 0.15);
      if(id !== null){ c.hecho = true; if(!cuchillaDisponible(p)){ avisar('La cuchilla del 7 se gana en el cinturón naranja.', 'info'); } else ejecutarCorte(id, p); }
    }
    c.ultimo = w; anadirEstela(w);
  });
  function fin(ev){
    var c = UI.corte; if(!c || c.id !== ev.pointerId) return;
    UI.corte = null;

/* ---------------- entrada: tocar un número (atrapar, o cortar con la cuchilla preparada) ---------------- */
lienzo.addEventListener('pointerdown', function(ev){

lienzo.addEventListener('pointerup', function(ev){
  var t = UI.toque; if(!t || t.id !== ev.pointerId) return; UI.toque = null;
  if(!jugable()) return;
  var mov = Math.hypot(ev.clientX - t.x0, ev.clientY - t.y0), dur = performance.now() - t.t0;
  if(mov < 22 && dur < 800){
    var w = aMundo(ev.clientX, ev.clientY), id = t.objetivo;
    if(id === null || !M.cuerpos().some(function(c){ return c.id === id; })) id = M.golpeEn(w[0], w[1], 0.45);

/* ---------------- teclado ---------------- */
function teclaNorm(ev){ return (ev.key && ev.key.length === 1) ? ev.key.toLowerCase() : ev.key; }
document.addEventListener('keydown', function(ev){
  var tag = (ev.target && ev.target.tagName) || '', k = teclaNorm(ev);
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if((tag === 'BUTTON' || tag === 'A') && (k === 'Enter' || k === ' ')) return;
  if(UI.panel){ if(k === 'Escape' && (UI.panel === 'ayuda' || UI.panel === 'pausa')){ ev.preventDefault(); cerrarPanelVolver(); } return; }
  if(k === 'p'){ alternarPausa(); return; }
  if(k === 'm'){ alternarSonido(); return; }
  if(k === '?'){ abrirAyudaDesdeJuego(); return; }
  if(M.fase === 'forja'){
    if(k === '2' || k === '3' || k === '5' || k === '7'){ ev.preventDefault(); forjaAnadir(+k); return; }
    if(k === 'Backspace'){ ev.preventDefault(); forjaQuitar(); return; }
    if(k === 'Enter'){ ev.preventDefault(); forjaLanzar(); return; }
    if(k === 'Escape'){ ev.preventDefault(); forjaCancelar(); return; }
    return;
  }
  if(!jugable()) return;
  if(k === '2' || k === '3' || k === '5' || k === '7'){ ev.preventDefault(); UI.teclado = true; Sonido.despertar(); var id = objetivoActual(); if(id !== null) ejecutarCorte(id, +k); return; }
  if(k === ' ' || k === 'a'){ ev.preventDefault(); UI.teclado = true; var id2 = objetivoActual(); if(id2 !== null) ejecutarAtrapar(id2); return; }
  if(k === 'ArrowLeft' || k === 'ArrowRight'){ ev.preventDefault(); cambiarObjetivo(k === 'ArrowLeft' ? -1 : 1); return; }
  if(k === 'f'){ abrirForja(); return; }
  if(k === 'l'){ anunciarAire(); return; }
  if(k === 'Escape' && UI.armada !== null){ alternarArmada(null); return; }
});

      + '<h3>Atrapar</h3><p>Cuando lo que queda es un número primo, tócalo para atraparlo. Si llegas a 1, también está terminado.</p>'

      + '<h3>Errores</h3><p>Una cuchilla que no divide suena «clonk»: la bola cae más deprisa y se agrieta, y a la tercera grieta se rompe. El 7 no agrieta. Pierdes un corazón si atrapas un número que no es primo, si una bola se rompe o si toca el suelo. Sin corazones, el cinturón vuelve a empezar.</p>'
      + '<h3>Los Gemelos</h3><p>Desde el cinturón amarillo, al final llegan dos números encadenados. Solo se cortan juntos, con una cuchilla que divida a los dos, y la cadena se rompe cuando ya no comparten ningún divisor: los primos que has cortado forman su <b>máximo común divisor</b>. Con la <b>forja</b> combinas gemas de tu cesta en una sola cuchilla, que es su producto; si aciertas el m.c.d. de un solo tajo, es un tajo maestro.</p>'
      + '<h3>Puntos</h3><p>10 por cada corte y 20 por cada factor al terminar un número. Los impostores, números impares que parecen primos y no lo son (como 91 = 7·13), dan 50 más. Cada tres aciertos seguidos sube el combo, hasta multiplicar por 4.</p>'
      + '<h3>Modo tranquilo</h3><p>La gravedad es más suave y solo vuela un número cada vez.</p>'
      + '<h3>Teclado</h3><p>2, 3, 5 y 7 cortan el número marcado (el más bajo, si no eliges otro); Espacio o A lo atrapan; las flechas ← y → cambian de número; F abre la forja; L dice qué hay en el aire; P pausa; M sonido. En la forja: 2, 3, 5 y 7 añaden gemas, la tecla de borrar quita la última, Intro lanza y Esc cancela.</p>'
      + '<div class="fila"><button type="button" class="btn principal" id="mVolver">Volver</button></div>' + pie();
  } else if(nombre === 'pausa'){
    h = '<h2 id="panelTitulo">Pausa</h2><p class="sub">' + E.fmtPuntos(M.puntos) + ' puntos</p>'
      + '<div class="fila"><button type="button" class="btn principal" id="mVolver">Continuar</button><button type="button" class="btn" id="mAyuda">Cómo se juega</button></div>'
      + '<div class="fila"><button type="button" class="btn secundario" id="mMenu">Abandonar la partida</button></div>' + pie();
  } else if(nombre === 'fallo'){
    var cf = E.CINTURONES[M.cinturon];
    h = '<h2 id="panelTitulo">¡Sin corazones!</h2><p class="sub">' + cf.nombre + '</p><p class="cifra">' + E.fmtPuntos(M.puntos) + ' puntos</p>' + tablaEstad()
      + (UI.recordNuevo ? '<p class="aviso-sesion">¡Nuevo récord!</p>' : '<p class="recor">' + textoRecords() + '</p>')
      + '<div class="fila"><button type="button" class="btn principal" id="mReintentar">Repetir el ' + cf.nombre.toLowerCase() + '</button>'
      + (M.tranquilo ? '' : '<button type="button" class="btn" id="mReintentarTranquilo">Repetirlo en modo tranquilo</button>') + '</div>'
      + '<div class="fila"><button type="button" class="btn secundario" id="mMenu">Menú</button></div>' + pie();
  } else if(nombre === 'fin'){
    h = '<h2 id="panelTitulo">' + (UI.completo ? '¡Reto completado!' : 'Fin del reto') + '</h2><p class="sub">Reto del día · ' + fechaBonita() + (M.tranquilo ? ' · modo tranquilo' : '') + '</p>'
      + '<p class="cifra">' + E.fmtPuntos(M.puntos) + ' puntos</p>' + tablaEstad()
      + (UI.recordNuevo ? '<p class="aviso-sesion">¡Tu mejor marca de hoy!</p>' : '<p class="recor">' + textoRecords() + '</p>')
      + '<div class="fila"><button type="button" class="btn principal" id="mOtraReto">Otra vez</button><button type="button" class="btn" id="mMenu">Menú</button></div>' + pie();
  } else if(nombre === 'victoria'){
    h = '<h2 id="panelTitulo">¡Cinturón negro!</h2><p class="sub">Has superado los cinco cinturones' + (M.tranquilo ? ' en modo tranquilo' : '') + '.</p>'
      + '<p class="cifra">' + E.fmtPuntos(M.puntos) + ' puntos</p>' + tablaEstad()
      + (UI.recordNuevo ? '<p class="aviso-sesion">¡Nuevo récord!</p>' : '<p class="recor">' + textoRecords() + '</p>')
      + '<div class="fila"><button type="button" class="btn principal" id="mJugar">Otra partida</button><button type="button" class="btn" id="mMenu">Menú</button></div>' + pie();
  } else if(nombre === 'dueloInicio'){
    h = '<h2 id="panelTitulo">Duelo por turnos</h2><p>Los dos jugadores reciben exactamente los mismos números: 15 bolas y los Gemelos, con tres corazones. Primero juega uno y después el otro. Gana quien haga más puntos.</p>'
      + '<div class="fila"><button type="button" class="btn principal" id="mDueloEmpezar">Empieza el jugador 1</button><button type="button" class="btn secundario" id="mMenu">Menú</button></div>' + pie();
  } else if(nombre === 'dueloTurno'){
    h = '<h2 id="panelTitulo">Turno del jugador 2</h2><p class="sub">El jugador 1 ha hecho</p><p class="cifra">' + E.fmtPuntos(UI.duelo.puntos[0]) + ' puntos</p>'
      + '<p>Ahora le toca al jugador 2, con los mismos números.</p>'
      + '<div class="fila"><button type="button" class="btn principal" id="mDueloSegundo">Empieza el jugador 2</button></div>' + pie();
  } else if(nombre === 'dueloFin'){
    var a = UI.duelo.puntos[0], b = UI.duelo.puntos[1];
    var gana = a === b ? '¡Empate!' : (a > b ? '¡Gana el jugador 1!' : '¡Gana el jugador 2!');
    h = '<h2 id="panelTitulo">' + gana + '</h2><div class="tabla"><b>' + E.fmtPuntos(a) + '</b><span>jugador 1</span><b>' + E.fmtPuntos(b) + '</b><span>jugador 2</span></div>'
      + '<div class="fila"><button type="button" class="btn principal" id="mRevancha">Revancha con otros números</button><button type="button" class="btn" id="mMenu">Menú</button></div>' + pie();
  }
  p.innerHTML = h; $('velo').hidden = false; bloquearFondo(true);
  var b2;
  if((b2 = $('mJugar'))) b2.addEventListener('click', function(){ iniciar('campana', 0); });
  if((b2 = $('mReto'))) b2.addEventListener('click', function(){ iniciar('reto'); });
  if((b2 = $('mOtraReto'))) b2.addEventListener('click', function(){ iniciar('reto'); });
  if((b2 = $('mDuelo'))) b2.addEventListener('click', function(){ UI.duelo = { turno:1, semilla:((Date.now() % 2147483647) | 0) || 11, puntos:[0, 0], completo:[false, false] }; abrirPanel('dueloInicio'); });
  if((b2 = $('mDueloEmpezar'))) b2.addEventListener('click', function(){ UI.duelo.turno = 1; iniciar('duelo'); });
  if((b2 = $('mDueloSegundo'))) b2.addEventListener('click', function(){ UI.duelo.turno = 2; iniciar('duelo'); });
  if((b2 = $('mRevancha'))) b2.addEventListener('click', function(){ UI.duelo = { turno:1, semilla:((Date.now() % 2147483647) | 0) || 13, puntos:[0, 0], completo:[false, false] }; iniciar('duelo'); });
  if((b2 = $('mTranquilo'))) b2.addEventListener('click', function(){ progreso.tranquilo = !progreso.tranquilo; guardar(); abrirPanel('menu', 'mTranquilo'); });
  if((b2 = $('mPistas'))) b2.addEventListener('click', function(){ progreso.pistas = !progreso.pistas; guardar(); actualizarCuchillas(); abrirPanel('menu', 'mPistas'); });
  if((b2 = $('mAyuda'))) b2.addEventListener('click', function(){ UI.panelPrevio = nombre; abrirPanel('ayuda'); });
  if((b2 = $('mVolver'))) b2.addEventListener('click', cerrarPanelVolver);
  if((b2 = $('mMenu'))) b2.addEventListener('click', function(){ M.fase = 'menu'; UI.pausa = false; mostrarForja(false); Sonido.congelar(false); abrirPanel('menu'); });
  if((b2 = $('mReintentar'))) b2.addEventListener('click', function(){ cerrarPanel(); limpiarEfectos(); M.reintentar(); procesarEventos(); });
  if((b2 = $('mReintentarTranquilo'))) b2.addEventListener('click', function(){ progreso.tranquilo = true; guardar(); M.tranquilo = true; cerrarPanel(); limpiarEfectos(); M.reintentar(); procesarEventos(); });
  Array.prototype.forEach.call(p.querySelectorAll('[data-cinturon]'), function(bt){ bt.addEventListener('click', function(){ iniciar('campana', +bt.getAttribute('data-cinturon')); }); });
  var objetivo = (focoId && $(focoId)) || p.querySelector('button:not([disabled])');
  if(objetivo) setTimeout(function(){ if(UI.panel === nombre) objetivo.focus(); }, 30);
}
function cerrarPanel(){
  UI.panel = null; $('velo').hidden = true; $('panel').innerHTML = ''; bloquearFondo(false);
  var f = UI.focoPrevio; UI.focoPrevio = null;
  if(f && f.focus && document.contains(f) && f !== document.body){ try{ f.focus(); }catch(e){} }
}
function cerrarPanelVolver(){
  if(UI.panel === 'ayuda'){
    var prev = UI.panelPrevio; UI.panelPrevio = null;
    if(prev && prev !== 'ayuda' && prev !== 'juego'){ abrirPanel(prev); return; }
    cerrarPanel(); UI.pausa = false;
    if(M.fase === 'menu') abrirPanel('menu');
    return;
  }
  if(UI.panel === 'pausa') UI.pausa = false;
  cerrarPanel();
  if(M.fase === 'menu') abrirPanel('menu');
}
function abrirAyudaDesdeJuego(){
  if(UI.panel === 'ayuda') return;
  UI.panelPrevio = UI.panel || 'juego';
  if(!UI.panel && (M.fase === 'jugando' || M.fase === 'forja' || M.fase === 'transicion')) UI.pausa = true;
  abrirPanel('ayuda');
}
function limpiarEfectos(){ UI.particulas.length = 0; UI.textos.length = 0; UI.mitades.length = 0; UI.vuelos.length = 0; UI.estela.length = 0; UI.sacudida = 0; UI.destello = 0; }
function iniciar(modo, cinturon){
  Sonido.despertar(); cerrarPanel(); UI.pausa = false; limpiarEfectos(); UI.recordNuevo = false; hudPrev = {}; UI.armada = null; UI.objetivo = null;
  var sem = modo === 'reto' ? semillaDia() : (modo === 'duelo' ? UI.duelo.semilla : (((Date.now() % 2147483647) | 0) || 17));
  M.nuevaPartida(modo, { tranquilo:progreso.tranquilo, semilla:sem, cinturon:cinturon || 0 });
  procesarEventos(); actualizarCuchillas();
  var b = document.querySelector('.cuchilla[data-p="2"]'); if(b) b.focus();
}
function alternarPausa(){
  if(UI.panel){ if(UI.panel === 'pausa') cerrarPanelVolver(); return; }
  if(M.fase !== 'jugando' && M.fase !== 'forja' && M.fase !== 'transicion') return;
  UI.pausa = true; abrirPanel('pausa');
}
function alternarSonido(){ var on = Sonido.alternar(); var b = $('bSonido'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? '🔊' : '🔇'; }
$('bSonido').addEventListener('click', alternarSonido);
$('bPausa').addEventListener('click', alternarPausa);
$('bAyuda').addEventListener('click', abrirAyudaDesdeJuego);
document.addEventListener('visibilitychange', function(){ if(document.hidden && !UI.panel && (M.fase === 'jugando' || M.fase === 'forja' || M.fase === 'transicion')) alternarPausa(); });
window.addEventListener('resize', ajustar);
window.addEventListener('blur', function(){ UI.corte = null; UI.toque = null; });

/* ---------------- bucle ---------------- */
var prevTs = 0, acc = 0, PASO = 1 / 120;
function tic(ts){
  requestAnimationFrame(tic);
  if(!prevTs) prevTs = ts; var dt = Math.min(0.05, (ts - prevTs) / 1000); prevTs = ts; UI.reloj += dt;
  if(!UI.pausa && !UI.panel && (M.fase === 'jugando' || M.fase === 'forja' || M.fase === 'transicion')){
    acc += dt; var n = 0;
    while(acc >= PASO && n < 12){ M.paso(PASO); acc -= PASO; n++; }
    if(n >= 12) acc = 0;
    procesarEventos(); vigilarCaidas();
  }
  if(UI.ninjaLanza > 0) UI.ninjaLanza = Math.max(0, UI.ninjaLanza - dt);
  if(UI.sacudida > 0) UI.sacudida = Math.max(0, UI.sacudida - dt * 3);
  if(UI.destello > 0) UI.destello = Math.max(0, UI.destello - dt * 2.5);
  if(UI.bannerT > 0){ UI.bannerT -= dt; if(UI.bannerT <= 0) $('banner').classList.remove('visible'); }
  if(M.fase === 'forja' && M.forja) $('forjaMedidorBarra').style.width = clamp(M.forja.congelacion / K.CONGELACION_FORJA * 100, 0, 100).toFixed(1) + '%';
  vaciarAvisos(UI.reloj);
  dibujar(dt); actualizarHUD(); actualizarForjaBoton();
}
ajustar(); actualizarCuchillas(); abrirPanel('menu');
requestAnimationFrame(tic);

/* ganchos de verificación: avanzar la física a mano cuando el panel del navegador está oculto */
function avanzar(segundos){
  var n = Math.max(1, Math.round((segundos || 1) / PASO));
  for(var i = 0; i < n; i++){ if(!(M.fase === 'jugando' || M.fase === 'forja' || M.fase === 'transicion')) break; M.paso(PASO); if(M.eventos.length > 40) procesarEventos(); }
  procesarEventos(); UI.reloj += segundos || 1; dibujar(Math.min(segundos || 1, 1)); actualizarHUD(); actualizarForjaBoton(); tUltimoAviso = -9; vaciarAvisos(UI.reloj);
}
window.__malabares = { M:M, E:E, UI:UI, iniciar:iniciar, avanzar:avanzar, dibujar:dibujar, procesarEventos:procesarEventos, ejecutarCorte:ejecutarCorte, ejecutarAtrapar:ejecutarAtrapar,
  abrirPanel:abrirPanel, cerrarPanel:cerrarPanel, abrirForja:abrirForja, forjaAnadir:forjaAnadir, forjaLanzar:forjaLanzar, aMundo:aMundo, sx:sx, sy:sy, ajustar:ajustar, Sonido:Sonido, progreso:progreso };
})();
</script>
</body>
</html>
