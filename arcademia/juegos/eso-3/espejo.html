<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e24">
<title>ESPEJO · Arcademia</title>
<!--
  Juego: ESPEJO — el bullet-hell de las isometrías
  Curso: 3.º ESO (las primeras oleadas, solo con vectores y espejos
  verticales u horizontales, sirven también en 2.º ESO)
  Tema: Movimientos en el plano — traslaciones (vector), simetrías
  axiales (ejes x = k, y = k, y = x + k, y = −x + k), giros (centro y
  ángulo de 90°, 180° y 270°), mediatriz y punto medio como lugar
  geométrico, composición de movimientos (dos espejos paralelos son una
  traslación; dos perpendiculares, un giro de 180°).
  Origen: diseñado para Arcademia (2026-09-01); autocontenido: canvas y
  WebAudio nativos, sin dependencias externas ni webfonts.
  Mecánica: la nave no dispara. Al pulsar Espejo, Giro o Vector el
  tiempo se congela y el jugador dibuja sobre la cuadrícula un eje, un
  centro de giro o un vector; al aplicarlo, la isometría se aplica DE
  VERDAD a la posición y a la velocidad de todas las balas en pantalla,
  que pasan a su bando. No hay corrector de respuestas: el daño emerge
  de dónde caen las balas transformadas.
  Estructura: el bloque de script «logica» es lógica pura sin DOM
  (isometrías, oleadas y motor de juego) y se ejecuta tal cual en jsc
  para el barrido de verificación; el bloque «interfaz» es la capa de
  canvas, mandos, sonido y paneles.
-->
<style>
:root{
  --fondo:#0a0e24; --panel:#131843; --panel-2:#1b2160; --borde:#2a3380;
  --tinta:#f4ecff; --tinta-2:#b9bde6;
  --cian:#38e0f0; --ambar:#ffc229; --magenta:#f472b6; --verde:#6ee7b7;
  --rojo:#ff5c5c; --violeta:#a78bfa;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%; overflow:hidden}
body{
  background:var(--fondo); color:var(--tinta); font-family:var(--ui);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 9%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 36%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 62%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 74%, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 65% 88%, rgba(255,255,255,.45) 50%, transparent 51%);
}
#app{
  display:flex; flex-direction:column; height:100dvh; width:100%;
  max-width:620px; margin:0 auto; position:relative; z-index:1;
}

/* ---------------- barra superior ---------------- */
#superior{
  display:flex; align-items:center; gap:8px; padding:6px 8px; flex:0 0 auto;
  border-bottom:1px solid var(--borde); background:linear-gradient(#141a4a,#0d1233);
}
#rotulo{display:flex; flex-direction:column; min-width:0; margin-right:auto}
#rotulo .n{font:700 10px/1.1 var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--verde)}
#rotulo .t{font:800 19px/1.15 var(--mono); letter-spacing:.22em; color:var(--ambar); text-shadow:0 0 8px rgba(255,194,41,.55)}
#botonera{display:flex; gap:6px}
.icobtn{
  width:36px; height:36px; border-radius:10px; border:2px solid var(--borde);
  background:#0f1440; color:var(--ambar); font:700 16px var(--mono);
  display:grid; place-items:center; cursor:pointer; text-decoration:none;
  box-shadow:0 2px 0 #050826; padding:0;
}
.icobtn[aria-pressed="false"]{opacity:.55}
.icobtn:hover,.icobtn:focus-visible{background:var(--ambar); color:#141a4a}
.icobtn:focus-visible,.herr:focus-visible,.btn:focus-visible,#planEntrada:focus-visible,.pie-marca a:focus-visible{outline:3px solid #ffffff; outline-offset:2px}

/* ---------------- marcador ---------------- */
#hud{
  display:grid; grid-template-columns:repeat(6,1fr); gap:4px; padding:4px 6px;
  background:#0d1233; border-bottom:1px solid var(--borde); flex:0 0 auto;
}
.celda{display:flex; flex-direction:column; align-items:center; min-width:0}
.celda .eti{font:700 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-2)}
.celda .val{font:800 15px/1.25 var(--mono); color:var(--cian); white-space:nowrap}
#hCargas{color:var(--ambar); letter-spacing:.1em}
#hCasco{color:var(--rojo); letter-spacing:.05em}
#hCristales{color:var(--verde)}
#hVidas{color:var(--violeta)}
.val.destello{animation:destello .5s ease-out}
@keyframes destello{0%{filter:brightness(2.2)} 100%{filter:brightness(1)}}

/* ---------------- escenario ---------------- */
#escenario{
  position:relative; flex:1 1 auto; min-height:0; display:flex;
  align-items:center; justify-content:center; overflow:hidden; padding:4px;
}
canvas{display:block; background:#070a1e; border-radius:8px; touch-action:none}
#banner{
  position:absolute; left:10px; right:10px; top:10px; text-align:center;
  pointer-events:none; opacity:0; transition:opacity .3s; z-index:2;
}
#banner.visible{opacity:1}
#banner .grande{
  font:800 21px/1.1 var(--mono); color:var(--ambar); letter-spacing:.08em;
  text-shadow:0 0 10px rgba(255,194,41,.6), 0 2px 0 #050826;
}
#banner .pista{
  margin-top:6px; font:600 13px/1.35 var(--ui); color:var(--tinta);
  background:rgba(10,14,36,.9); border:1px solid var(--borde); border-radius:8px;
  padding:6px 10px; display:inline-block; max-width:100%;
}
#banner .pista code{font:700 13px var(--mono); color:var(--cian)}
@media (max-width:420px){ #banner .grande{font-size:18px} #banner .pista{font-size:12px; padding:4px 8px} #banner .pista code{font-size:12px} }

/* ---------------- mandos ---------------- */
#mandos{
  position:relative; height:120px; flex:0 0 auto; display:flex; align-items:stretch;
  gap:8px; padding:8px; border-top:1px solid var(--borde); background:#0d1233;
}
#joystick{flex:0 0 112px; display:flex; align-items:center; justify-content:center; touch-action:none}
#joyBase{
  width:96px; height:96px; border-radius:50%; border:2px solid var(--borde);
  background:radial-gradient(circle at 50% 40%, #1b2160, #0f1440); position:relative;
}
#joyPomo{
  position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px;
  border-radius:50%; background:radial-gradient(circle at 40% 35%, #6be6f4, #1b9fb3);
  box-shadow:0 0 12px rgba(56,224,240,.5); pointer-events:none;
}
#herramientas{flex:1 1 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; min-width:0}
.herr{
  border:2px solid var(--borde); border-radius:12px; background:#0f1440; color:var(--ambar);
  font:700 11px var(--mono); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; cursor:pointer; padding:4px 2px; text-transform:uppercase;
  letter-spacing:.06em; min-width:0;
}
.herr .ico{font-size:24px; line-height:1}
.herr kbd{font:600 10px var(--mono); color:var(--tinta-2); border:1px solid var(--borde); border-radius:4px; padding:0 4px}
.herr:hover,.herr:focus-visible{background:var(--ambar); color:#141a4a}
.herr:hover kbd,.herr:focus-visible kbd{color:#141a4a; border-color:#141a4a}
.herr[aria-disabled="true"]{opacity:.35; cursor:not-allowed}
.herr[aria-disabled="true"]:hover{background:#0f1440; color:var(--ambar)}
.herr.sin-cargas{border-style:dashed}

/* ---------------- panel de plan (tiempo congelado) ---------------- */
#plan{
  position:absolute; left:0; right:0; bottom:0; background:#0d1233; padding:6px 8px;
  display:flex; flex-direction:column; gap:4px; z-index:3; border-top:1px solid var(--cian);
  min-height:120px; max-height:min(60%, 280px); overflow-y:auto; box-shadow:0 -6px 18px rgba(0,0,0,.45);
}
#plan > *{flex:0 0 auto}
#plan[hidden]{display:none}
#planTitulo{font:700 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--verde); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pantalla{
  font:800 17px/1.25 var(--mono); color:#f6f8ff; background:#0a0e24;
  border:1px solid var(--borde); border-radius:8px; padding:4px 8px; min-height:30px;
  overflow-x:auto; white-space:nowrap;
}
#planAngulos,#planBotones{display:flex; gap:6px}
#planAngulos[hidden],#planPizarra[hidden]{display:none}
.btn{
  flex:1 1 auto; border:2px solid var(--borde); border-radius:10px; background:#0f1440;
  color:var(--ambar); font:700 13px var(--mono); padding:6px 8px; cursor:pointer; min-height:36px;
}
.btn:hover,.btn:focus-visible{background:var(--ambar); color:#141a4a}
.btn.secundario{color:var(--tinta-2)}
.btn[aria-pressed="true"]{background:var(--verde); color:#0a0e24; border-color:var(--verde)}
#planPizarra{display:flex; align-items:center; gap:6px}
#planPizarra label{font:700 11px var(--mono); color:var(--tinta-2); white-space:nowrap}
#planEntrada{
  flex:1 1 auto; min-width:0; font:700 16px var(--mono); color:#f6f8ff; background:#0a0e24;
  border:1px solid var(--cian); border-radius:8px; padding:4px 8px;
}
#planAyuda{font:600 11px/1.3 var(--ui); color:var(--tinta-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#planMedidor{height:5px; background:#0a0e24; border-radius:3px; overflow:hidden; margin-top:auto}
#planMedidorBarra{height:100%; width:100%; background:linear-gradient(90deg, var(--cian), var(--violeta))}

/* ---------------- región viva y paneles ---------------- */
#aviso{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
#velo{
  position:absolute; inset:0; background:rgba(5,8,30,.88); display:flex; align-items:center;
  justify-content:center; padding:12px; z-index:10; overflow:auto;
}
#velo[hidden]{display:none}
.panel{
  width:100%; max-width:460px; background:var(--panel); border:2px solid var(--ambar);
  border-radius:16px; padding:16px; box-shadow:0 0 24px rgba(255,194,41,.25);
  max-height:100%; overflow:auto;
}
.panel h2{margin:0 0 6px; font:800 24px/1.1 var(--mono); letter-spacing:.2em; color:var(--ambar); text-align:center}
.panel h3{margin:12px 0 4px; font:700 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--verde)}
.panel p{margin:6px 0; font:500 14px/1.45 var(--ui); color:var(--tinta)}
.panel .sub{text-align:center; color:var(--tinta-2); font-size:13px}
.panel .fila{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.panel .btn{flex:1 1 140px}
.panel .btn.principal{background:var(--ambar); color:#141a4a; border-color:var(--ambar)}
.panel .btn.principal:hover,.panel .btn.principal:focus-visible{background:#ffd76a; color:#141a4a}
.panel ul{margin:4px 0; padding-left:18px; font:500 13px/1.45 var(--ui)}
.panel li{margin:3px 0}
.panel code{font:700 13px var(--mono); color:var(--cian)}
.panel .recor{font:700 13px/1.4 var(--mono); color:var(--tinta-2); text-align:center; margin-top:8px}
.panel .cifra{font:800 34px/1.1 var(--mono); color:var(--cian); text-align:center; margin:6px 0}
.pie-marca{margin-top:12px; text-align:center; font:600 12px var(--mono); color:var(--tinta-2)}
.pie-marca a{color:var(--verde)}
.tabla{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font:500 13px/1.4 var(--ui); margin:4px 0}
.tabla b{font:700 13px var(--mono); color:var(--cian); white-space:nowrap}
.aviso-sesion{font:600 12px/1.4 var(--ui); color:var(--ambar); text-align:center; margin-top:6px}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
@media (min-width:600px){ #mandos{height:130px} }
@media (max-height:560px){ #mandos{height:104px} #joyBase{width:84px; height:84px} .herr .ico{font-size:20px} }
</style>
</head>
<body>
<div id="app">
  <header id="superior">
    <a class="icobtn" id="bVolver" href="../../index.html" aria-label="Volver al salón Arcademia" title="Volver a Arcademia">←</a>
    <div id="rotulo"><span class="n">Geometría · 3.º ESO</span><span class="t">ESPEJO</span></div>
    <div id="botonera">
      <button type="button" class="icobtn" id="bSonido" aria-pressed="true" aria-label="Sonido" title="Sonido (M)">🔊</button>
      <button type="button" class="icobtn" id="bPausa" aria-label="Pausa" title="Pausa (P)">⏸</button>
      <button type="button" class="icobtn" id="bAyuda" aria-label="Cómo se juega" title="Cómo se juega (?)">?</button>
    </div>
  </header>

  <div id="hud" role="group" aria-label="Marcador">
    <div class="celda"><span class="eti">Oleada</span><span class="val" id="hOleada">–</span></div>
    <div class="celda"><span class="eti">Puntos</span><span class="val" id="hPuntos">0</span></div>
    <div class="celda"><span class="eti">Cargas</span><span class="val" id="hCargas" role="img" aria-label="3 de 3 cargas">●●●</span></div>
    <div class="celda"><span class="eti">Cristal</span><span class="val" id="hCristales">0/4</span></div>
    <div class="celda"><span class="eti">Casco</span><span class="val" id="hCasco" role="img" aria-label="Casco 3 de 3">♥♥♥</span></div>
    <div class="celda"><span class="eti">Vidas</span><span class="val" id="hVidas">3</span></div>
  </div>

  <div id="escenario">
    <canvas id="lienzo" role="img" aria-label="Cuadrícula de coordenadas de −6 a 6 con la nave, las torretas enemigas y las balas"></canvas>
    <div id="banner" aria-hidden="true"><div class="grande" id="bannerGrande"></div><div class="pista" id="bannerPista"></div></div>
  </div>

  <div id="mandos">
    <div id="joystick" aria-hidden="true"><div id="joyBase"><div id="joyPomo"></div></div></div>
    <div id="herramientas" role="group" aria-label="Transformaciones">
      <button type="button" class="herr" id="bEspejo" data-herr="espejo" aria-keyshortcuts="E"><span class="ico" aria-hidden="true">⟋</span><span>Espejo</span><kbd aria-hidden="true">E</kbd></button>
      <button type="button" class="herr" id="bGiro" data-herr="giro" aria-keyshortcuts="G"><span class="ico" aria-hidden="true">↻</span><span>Giro</span><kbd aria-hidden="true">G</kbd></button>
      <button type="button" class="herr" id="bVector" data-herr="vector" aria-keyshortcuts="V"><span class="ico" aria-hidden="true">→</span><span>Vector</span><kbd aria-hidden="true">V</kbd></button>
    </div>
  </div>

  <div id="plan" hidden role="group" aria-labelledby="planTitulo">
    <div id="planTitulo"></div>
    <div id="planEcuacion" class="pantalla"></div>
    <div id="planAngulos" hidden role="group" aria-label="Ángulo del giro (antihorario)">
      <button type="button" class="btn" data-ang="90">↺ 90°</button>
      <button type="button" class="btn" data-ang="180">180°</button>
      <button type="button" class="btn" data-ang="270">↻ 270°</button>
    </div>
    <div id="planPizarra" hidden>
      <label for="planEntrada" id="planEtiqueta">Eje</label>
      <input id="planEntrada" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="planAyuda"></div>
    <div id="planBotones">
      <button type="button" class="btn" id="bAplicar">Aplicar (Intro)</button>
      <button type="button" class="btn secundario" id="bCancelar">Cancelar (Esc)</button>
    </div>
    <div id="planMedidor" aria-hidden="true"><div id="planMedidorBarra"></div></div>
  </div>

  <div id="aviso" role="status" aria-live="polite"></div>
  <div id="velo"><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitulo"></div></div>
</div>

<script id="logica">
/* @@LOGICA-INICIO — lógica pura de ESPEJO, sin DOM (se ejecuta tal cual en jsc) */
var ESPEJO = (function(){
"use strict";
var LIMITE = 6;             /* cuadrícula de −6 a 6 */
var BORDE_NAVE = 5.8;       /* la nave no sale de ±5,8 */
var VEL_NAVE = 3;           /* unidades por segundo */
var R_NAVE = 0.2, R_BALA = 0.15;
var CARGAS_MAX = 3, CRISTALES_POR_CARGA = 4;
var CADENCIA_CRISTAL = 2.0, CRISTALES_MAX = 6;
var CONGELACION = 8;        /* segundos de tiempo congelado por plan */
var FUERA = 6.6;            /* las balas mueren más allá */

/* ---------- utilidades numéricas y de formato (coma decimal) ---------- */
function red05(v){ return Math.round(v*2)/2; }
function casi(a,b,eps){ return Math.abs(a-b) <= (eps===undefined ? 1e-9 : eps); }
function esEntero(v){ return casi(v, Math.round(v), 1e-9); }
function esMedio(v){ return casi(v*2, Math.round(v*2), 1e-9); }
function fmtNum(v, dec){
  if(casi(v,0,1e-9)) v = 0;
  var s;
  if(dec===undefined){
    if(esEntero(v)) s = String(Math.round(Math.abs(v)));
    else { s = Math.abs(v).toFixed(2); if(/0$/.test(s)) s = s.slice(0,-1); s = s.replace('.',','); }
  } else { s = Math.abs(v).toFixed(dec).replace('.',','); }
  return (v<0 ? '−' : '') + s;
}
function fmtPar(p, dec){
  var a = fmtNum(p[0],dec), b = fmtNum(p[1],dec);
  var sep = (a.indexOf(',')>=0 || b.indexOf(',')>=0) ? '; ' : ', ';
  return '(' + a + sep + b + ')';
}
function fmtPuntos(n){ var s=String(Math.round(n)); return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function cosE(a){ a=((a%360)+360)%360; if(a===0) return 1; if(a===90) return 0; if(a===180) return -1; if(a===270) return 0; return Math.cos(a*Math.PI/180); }
function sinE(a){ a=((a%360)+360)%360; if(a===0) return 0; if(a===90) return 1; if(a===180) return 0; if(a===270) return -1; return Math.sin(a*Math.PI/180); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- Movimientos: isometrías del plano ----------
   iso = {tipo:'espejo', fam:'x'|'y'|'d'|'a', k}   x = k · y = k · y = x + k · y = −x + k
       | {tipo:'giro', centro:[a,b], angulo: 90|180|270}   (antihorario)
       | {tipo:'traslacion', v:[a,b]}
       | {tipo:'identidad'}                                              */
var Movimientos = {
  aplicarPunto: function(iso, p){
    var x=p[0], y=p[1];
    if(iso.tipo==='espejo'){
      var k=iso.k;
      if(iso.fam==='x') return [2*k-x, y];
      if(iso.fam==='y') return [x, 2*k-y];
      if(iso.fam==='d') return [y-k, x+k];
      if(iso.fam==='a') return [k-y, k-x];
    }
    if(iso.tipo==='giro'){
      var c=iso.centro, cs=cosE(iso.angulo), sn=sinE(iso.angulo), dx=x-c[0], dy=y-c[1];
      return [c[0]+dx*cs-dy*sn, c[1]+dx*sn+dy*cs];
    }
    if(iso.tipo==='traslacion') return [x+iso.v[0], y+iso.v[1]];
    return [x,y];
  },
  aplicarVector: function(iso, v){
    if(iso.tipo==='espejo'){
      if(iso.fam==='x') return [-v[0], v[1]];
      if(iso.fam==='y') return [v[0], -v[1]];
      if(iso.fam==='d') return [v[1], v[0]];
      if(iso.fam==='a') return [-v[1], -v[0]];
    }
    if(iso.tipo==='giro'){ var cs=cosE(iso.angulo), sn=sinE(iso.angulo); return [v[0]*cs-v[1]*sn, v[0]*sn+v[1]*cs]; }
    return [v[0], v[1]];
  },
  ecuacionEje: function(iso){
    var k=iso.k, ks=fmtNum(Math.abs(k)), signo = k<0 ? ' − ' : ' + ';
    if(iso.fam==='x') return 'x = ' + fmtNum(k);
    if(iso.fam==='y') return 'y = ' + fmtNum(k);
    if(iso.fam==='d') return casi(k,0) ? 'y = x' : 'y = x' + signo + ks;
    if(iso.fam==='a') return casi(k,0) ? 'y = −x' : 'y = −x' + signo + ks;
    return '';
  },
  describir: function(iso){
    if(!iso) return '';
    if(iso.tipo==='espejo') return 'Espejo ' + Movimientos.ecuacionEje(iso);
    if(iso.tipo==='giro') return 'Giro de ' + iso.angulo + '° con centro ' + fmtPar(iso.centro);
    if(iso.tipo==='traslacion') return 'Traslación de vector ' + fmtPar(iso.v);
    if(iso.tipo==='identidad') return 'Identidad';
    return '';
  },
  puntoMedio: function(A,B){ return [(A[0]+B[0])/2, (A[1]+B[1])/2]; },
  /* mediatriz del segmento AB si cae en una de las cuatro familias; si no, null */
  mediatriz: function(A,B){
    var dx=B[0]-A[0], dy=B[1]-A[1], M=[(A[0]+B[0])/2,(A[1]+B[1])/2];
    if(casi(dx,0)&&casi(dy,0)) return null;
    if(casi(dy,0)) return {tipo:'espejo', fam:'x', k:M[0]};
    if(casi(dx,0)) return {tipo:'espejo', fam:'y', k:M[1]};
    if(casi(dx,-dy)) return {tipo:'espejo', fam:'d', k:M[1]-M[0]};
    if(casi(dx,dy))  return {tipo:'espejo', fam:'a', k:M[0]+M[1]};
    return null;
  },
  /* imán: de un arrastre p0→p1 al eje más cercano de las cuatro familias */
  imantar: function(p0, p1){
    var dx=p1[0]-p0[0], dy=p1[1]-p0[1];
    if(Math.hypot(dx,dy) < 0.5) return null;
    var ang=Math.atan2(dy,dx)*180/Math.PI; if(ang<0) ang+=180; if(ang>=180) ang-=180;
    var mx=(p0[0]+p1[0])/2, my=(p0[1]+p1[1])/2, iso;
    if(ang<22.5 || ang>=157.5) iso={tipo:'espejo', fam:'y', k:red05(my)};
    else if(ang<67.5)          iso={tipo:'espejo', fam:'d', k:red05(my-mx)};
    else if(ang<112.5)         iso={tipo:'espejo', fam:'x', k:red05(mx)};
    else                       iso={tipo:'espejo', fam:'a', k:red05(mx+my)};
    return Movimientos.acotar(iso);
  },
  acotar: function(iso){
    if(iso.tipo==='espejo'){
      var lim = (iso.fam==='x'||iso.fam==='y') ? LIMITE : 2*LIMITE-1;
      iso.k = Math.max(-lim, Math.min(lim, iso.k));
    } else if(iso.tipo==='giro'){
      iso.centro=[Math.max(-LIMITE,Math.min(LIMITE,iso.centro[0])), Math.max(-LIMITE,Math.min(LIMITE,iso.centro[1]))];
    }
    return iso;
  },
  validar: function(iso){
    if(!iso || !iso.tipo) return false;
    if(iso.tipo==='espejo'){
      if('xyda'.indexOf(iso.fam)<0 || iso.fam.length!==1) return false;
      if(!isFinite(iso.k) || !esMedio(iso.k)) return false;
      var lim=(iso.fam==='x'||iso.fam==='y') ? LIMITE : 2*LIMITE-1;
      return Math.abs(iso.k) <= lim + 1e-9;
    }
    if(iso.tipo==='giro'){
      if(!iso.centro || !isFinite(iso.centro[0]) || !isFinite(iso.centro[1])) return false;
      if(!esMedio(iso.centro[0]) || !esMedio(iso.centro[1])) return false;
      if(Math.abs(iso.centro[0])>LIMITE+1e-9 || Math.abs(iso.centro[1])>LIMITE+1e-9) return false;
      return iso.angulo===90 || iso.angulo===180 || iso.angulo===270;
    }
    if(iso.tipo==='traslacion'){
      return !!iso.v && isFinite(iso.v[0]) && isFinite(iso.v[1]) && esMedio(iso.v[0]) && esMedio(iso.v[1]);
    }
    return iso.tipo==='identidad';
  },
  /* forma afín p → L·p + t */
  matrizDe: function(iso){
    var e1=Movimientos.aplicarVector(iso,[1,0]), e2=Movimientos.aplicarVector(iso,[0,1]), t=Movimientos.aplicarPunto(iso,[0,0]);
    return {L:[[e1[0],e2[0]],[e1[1],e2[1]]], t:t};
  },
  /* primero m1, después m2 */
  componer: function(m1, m2){
    var A=Movimientos.matrizDe(m1), B=Movimientos.matrizDe(m2), L1=A.L, L2=B.L;
    var L=[[L2[0][0]*L1[0][0]+L2[0][1]*L1[1][0], L2[0][0]*L1[0][1]+L2[0][1]*L1[1][1]],
           [L2[1][0]*L1[0][0]+L2[1][1]*L1[1][0], L2[1][0]*L1[0][1]+L2[1][1]*L1[1][1]]];
    var t=[L2[0][0]*A.t[0]+L2[0][1]*A.t[1]+B.t[0], L2[1][0]*A.t[0]+L2[1][1]*A.t[1]+B.t[1]];
    return {L:L, t:t};
  },
  aplicarAfin: function(af, p){ return [af.L[0][0]*p[0]+af.L[0][1]*p[1]+af.t[0], af.L[1][0]*p[0]+af.L[1][1]*p[1]+af.t[1]]; },
  clasificar: function(af){
    var a=af.L[0][0], b=af.L[0][1], c=af.L[1][0], d=af.L[1][1], t=af.t, e=1e-7;
    var det=a*d-b*c;
    if(casi(a,1,e)&&casi(d,1,e)&&casi(b,0,e)&&casi(c,0,e)){
      if(casi(t[0],0,e)&&casi(t[1],0,e)) return {tipo:'identidad'};
      return {tipo:'traslacion', v:[t[0],t[1]]};
    }
    if(casi(det,1,e)){
      var ang=Math.round(Math.atan2(c,a)*180/Math.PI); ang=((ang%360)+360)%360;
      var det2=(1-a)*(1-d)-b*c;                       /* (I − L)·C = t */
      var C=[((1-d)*t[0]+b*t[1])/det2, (c*t[0]+(1-a)*t[1])/det2];
      return {tipo:'giro', centro:[C[0],C[1]], angulo:ang};
    }
    if(casi(det,-1,e)) return {tipo:'simetria'};
    return {tipo:'otro'};
  },
  /* imagen de una isometría por otra (conjugación g∘iso∘g⁻¹): sirve para el reto del día */
  transformarIso: function(g, iso){
    if(iso.tipo==='espejo'){
      var P, Q;
      if(iso.fam==='x'){ P=[iso.k,0]; Q=[iso.k,1]; }
      else if(iso.fam==='y'){ P=[0,iso.k]; Q=[1,iso.k]; }
      else if(iso.fam==='d'){ P=[0,iso.k]; Q=[1,1+iso.k]; }
      else { P=[0,iso.k]; Q=[1,iso.k-1]; }
      var P2=Movimientos.aplicarPunto(g,P), Q2=Movimientos.aplicarPunto(g,Q), dx=Q2[0]-P2[0], dy=Q2[1]-P2[1];
      if(casi(dx,0)) return {tipo:'espejo', fam:'x', k:P2[0]};
      if(casi(dy,0)) return {tipo:'espejo', fam:'y', k:P2[1]};
      if(casi(dx,dy)) return {tipo:'espejo', fam:'d', k:P2[1]-P2[0]};
      return {tipo:'espejo', fam:'a', k:P2[0]+P2[1]};
    }
    if(iso.tipo==='giro'){
      var det=Movimientos.matrizDe(g); var s=det.L[0][0]*det.L[1][1]-det.L[0][1]*det.L[1][0];
      var ang = s>0 ? iso.angulo : (360-iso.angulo)%360;
      return {tipo:'giro', centro:Movimientos.aplicarPunto(g, iso.centro), angulo:ang};
    }
    if(iso.tipo==='traslacion') return {tipo:'traslacion', v:Movimientos.aplicarVector(g, iso.v)};
    return iso;
  },
  /* lectura del modo Pizarra */
  normalizarTexto: function(txt){ return String(txt||'').toLowerCase().replace(/−|–/g,'-').replace(/\s+/g,'').replace(/·/g,''); },
  parsearEje: function(txt){
    var s=Movimientos.normalizarTexto(txt).replace(/,/g,'.'), m, k;
    var eje=null;
    if((m=/^x=(-?\d+(?:\.\d+)?)$/.exec(s))){ eje={tipo:'espejo',fam:'x',k:parseFloat(m[1])}; }
    else if((m=/^y=(-?\d+(?:\.\d+)?)$/.exec(s))){ eje={tipo:'espejo',fam:'y',k:parseFloat(m[1])}; }
    else if((m=/^y=(-?)x((?:[+-]\d+(?:\.\d+)?)?)$/.exec(s))){ eje={tipo:'espejo', fam:(m[1]==='-'?'a':'d'), k:(m[2] ? parseFloat(m[2]) : 0)}; }
    if(eje){
      if(!esMedio(eje.k)) return {error:'k debe ir de 0,5 en 0,5'};
      if(!Movimientos.validar(eje)) return {error:(eje.fam==='x'||eje.fam==='y') ? 'El eje debe cruzar la cuadrícula: k entre −6 y 6' : 'El eje debe cruzar la cuadrícula: k entre −11 y 11'};
      return eje;
    }
    return {error:'Escribe x = k, y = k, y = x + k o y = −x + k'};
  },
  parsearPar: function(txt){
    var s=Movimientos.normalizarTexto(txt).replace(/^\(|\)$/g,''), partes;
    if(s.indexOf(';')>=0){ partes=s.split(';'); }
    else if((s.match(/,/g)||[]).length===1 && !/\.\d/.test(s)){ partes=s.split(','); }
    else if((s.match(/,/g)||[]).length===1){ partes=s.split(','); }
    else if((s.match(/,/g)||[]).length===3){ var t=s.split(','); partes=[t[0]+'.'+t[1], t[2]+'.'+t[3]]; }
    else return {error:'Escribe el par como (a, b) o (a; b)'};
    if(partes.length!==2) return {error:'Escribe el par como (a, b) o (a; b)'};
    var a=parseFloat(partes[0].replace(',','.')), b=parseFloat(partes[1].replace(',','.'));
    if(!isFinite(a)||!isFinite(b)) return {error:'Escribe el par como (a, b) o (a; b)'};
    if(!esMedio(a)||!esMedio(b)) return {error:'Las coordenadas van de 0,5 en 0,5'};
    return [a,b];
  }
};

function copiar(o){ return JSON.parse(JSON.stringify(o)); }
/* modo 'campana': las oleadas tal cual; modo 'reto': cada oleada pasa por una simetría del cuadrado elegida por la semilla */
function construirOleadas(modo, semilla){
  var lista=copiar(OLEADAS), rng=mulberry32((semilla|0)||1);
  if(modo!=='reto') return lista;
  for(var i=0;i<lista.length;i++){
    var g=DIEDRICO[Math.floor(rng()*DIEDRICO.length)], o=lista[i];
    o.g=g; o.pista='';
    o.nave=Movimientos.aplicarPunto(g,o.nave);
    for(var j=0;j<o.enemigos.length;j++){ var e=o.enemigos[j]; e.pos=Movimientos.aplicarPunto(g,e.pos); if(e.dir) e.dir=Movimientos.aplicarVector(g,e.dir); }
    for(j=0;j<o.enemigos.length;j++){ if(o.enemigos[j].tipo==='jefe') o.enemigos[j].salto=Movimientos.transformarIso(g,{tipo:'giro',centro:[0,0],angulo:90}); }
    if(o.solucion){ o.solucion={ nave:Movimientos.aplicarPunto(g,o.solucion.nave), iso:Movimientos.transformarIso(g,o.solucion.iso), objetivo:o.solucion.objetivo, espera:o.solucion.espera }; }
  }
  return lista;
}

/* ---------- motor de juego (estado puro, emite eventos) ---------- */
function crearMotor(){
  var MAX=900;
  var M={
    balas:{ x:new Float32Array(MAX), y:new Float32Array(MAX), vx:new Float32Array(MAX), vy:new Float32Array(MAX), bando:new Uint8Array(MAX), gen:new Uint16Array(MAX), n:0 },
    enemigos:[], cristales:[], eventos:[],
    nave:{x:0,y:-4,inv:0}, mando:{dx:0,dy:0},
    oleadas:[], oleada:0, cargas:CARGAS_MAX, cristalesN:0, casco:3, vidas:3, puntos:0,
    fase:'menu', tiempo:0, tOleada:0, golpesOleada:0, tTransicion:0, plan:null,
    gen:0, gens:{}, ultimaIso:null, ultimaIsoT:-99,
    modo:'campana', pizarra:false, mult:1, rng:mulberry32(1), semilla:0, pistas:true,
    cronoCristal:0, dios:false,
    estad:{transformaciones:0, impactos:0, combos:0, devueltas:0, golpes:0}
  };
  function anadirBala(x,y,vx,vy){ var b=M.balas, i=b.n; if(i>=MAX) return; b.x[i]=x; b.y[i]=y; b.vx[i]=vx; b.vy[i]=vy; b.bando[i]=0; b.gen[i]=0; b.n=i+1; }
  function quitarBala(i){ var b=M.balas, j=b.n-1; b.x[i]=b.x[j]; b.y[i]=b.y[j]; b.vx[i]=b.vx[j]; b.vy[i]=b.vy[j]; b.bando[i]=b.bando[j]; b.gen[i]=b.gen[j]; b.n=j; }
  function crearEnemigo(d){
    return { tipo:d.tipo, x:d.pos[0], y:d.pos[1], hp:d.hp, hpMax:d.hp, r:d.r||(d.tipo==='jefe'?0.7:0.45),
             cad:d.cad||1, vel:d.vel||2, dir:d.dir?[d.dir[0],d.dir[1]]:[0,-1], ancho:d.ancho||1, n:d.n||8,
             apertura:d.apertura||30, paso:d.paso||30, fase:0, crono:0, vivo:true, patron:0, tPatron:0, tSalto:0,
             salto:d.salto||{tipo:'giro',centro:[0,0],angulo:90} };
  }
  function angular(e, grados, vel){ var a=grados*Math.PI/180, cx=Math.cos(a), sy=Math.sin(a); anadirBala(e.x+cx*(e.r+0.25), e.y+sy*(e.r+0.25), cx*vel, sy*vel); }
  function apuntada(e, vel, desvio){ var a=Math.atan2(M.nave.y-e.y, M.nave.x-e.x)*180/Math.PI + desvio; angular(e, a, vel); }
  function radial(e, n, vel, fase){ for(var i=0;i<n;i++) angular(e, fase+i*360/n, vel); }
  function recta(e){
    var d=e.dir, L=Math.hypot(d[0],d[1])||1, ux=d[0]/L, uy=d[1]/L, px=-uy, py=ux;
    for(var i=0;i<e.ancho;i++){ var off=(i-(e.ancho-1)/2)*0.5; anadirBala(e.x+ux*(e.r+0.25)+px*off, e.y+uy*(e.r+0.25)+py*off, ux*e.vel, uy*e.vel); }
  }
  var CAD_JEFE=[1.4,0.18,0.8];
  function disparar(e){
    switch(e.tipo){
      case 'gota': apuntada(e, e.vel, 0); break;
      case 'abanico': for(var i=0;i<e.n;i++) apuntada(e, e.vel, (i-(e.n-1)/2)*(e.apertura/Math.max(1,e.n-1))); break;
      case 'muro': recta(e); break;
      case 'flor': radial(e, e.n, e.vel, e.fase); e.fase+=180/e.n; break;
      case 'espiral': angular(e, e.fase, e.vel); angular(e, e.fase+180, e.vel); e.fase+=e.paso; break;
      case 'jefe':
        if(e.patron===0){ radial(e, 12, 1.6, e.fase); e.fase+=15; }
        else if(e.patron===1){ for(var j=0;j<3;j++) angular(e, e.fase+j*120, 1.9); e.fase+=23; }
        else { for(var k=0;k<5;k++) apuntada(e, 2.2, (k-2)*6); }
        break;
    }
  }
  function jefePaso(e, dt){
    e.tPatron+=dt; e.tSalto+=dt;
    if(e.tPatron>=8){ e.tPatron=0; e.patron=(e.patron+1)%3; e.cad=CAD_JEFE[e.patron]; e.crono=Math.min(e.crono,0.4); M.eventos.push({tipo:'jefePatron', patron:e.patron}); }
    if(e.tSalto>=12){
      e.tSalto=0; var g=e.salto, p=Movimientos.aplicarPunto(g,[e.x,e.y]);
      e.x=Math.round(p[0]*2)/2; e.y=Math.round(p[1]*2)/2;
      M.eventos.push({tipo:'jefeSalta', iso:g, pos:[e.x,e.y]});
    }
  }
  function generarCristal(){
    for(var intento=0;intento<12;intento++){
      var x=red05((M.rng()*2-1)*5), y=red05((M.rng()*2-1)*5), libre=true;
      for(var k=0;k<M.enemigos.length;k++){ var e=M.enemigos[k]; if(e.vivo && Math.hypot(e.x-x,e.y-y)<1.3){ libre=false; break; } }
      if(libre && Math.hypot(M.nave.x-x,M.nave.y-y)<1.0) libre=false;
      if(libre){ M.cristales.push({x:x,y:y,vida:9}); return true; }
    }
    return false;

function simularSolucion(idx, modo, semilla, tEspera, tSigue, isoAlt){
  var M=crearMotor(); M.nuevaPartida(modo, false, semilla||1); M.cargarOleada(idx,false); M.dios=true;

var TECLAS_MOV={ ArrowUp:[0,1], ArrowDown:[0,-1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,1], s:[0,-1], a:[-1,0], d:[1,0] };
function teclaNorm(ev){ return (ev.key && ev.key.length===1) ? ev.key.toLowerCase() : ev.key; }
document.addEventListener('keydown', function(ev){
  var tag=(ev.target && ev.target.tagName)||'', k=teclaNorm(ev);
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(tag==='INPUT'){
    if(k==='Enter'){ ev.preventDefault(); aplicarPropuesta(); }
    else if(k==='Escape'){ ev.preventDefault(); M.cancelarPlan(); procesarEventos(); }
    return;
  }
  if((tag==='BUTTON' || tag==='A') && (k==='Enter' || k===' ')) return;   /* el botón se activa solo */
  if(UI.panel){ if(k==='Escape' && (UI.panel==='ayuda' || UI.panel==='pausa')){ ev.preventDefault(); cerrarPanelVolver(); } return; }
  if(k==='p'){ alternarPausa(); return; }
  if(k==='m'){ alternarSonido(); return; }
  if(k==='?'){ UI.panelPrevio=null; if(M.fase==='jugando'||M.fase==='plan'||M.fase==='transicion') UI.pausa=true; abrirPanel('ayuda'); return; }
  if(M.fase==='plan'){
    if(k==='Escape'){ ev.preventDefault(); M.cancelarPlan(); procesarEventos(); return; }
    if(k==='Enter'){ ev.preventDefault(); aplicarPropuesta(); return; }
    if(M.pizarra) return;
    var p=UI.propuesta, herr=M.plan.herr, paso=0.5, d;
    if(!p) return;
    if(herr==='espejo'){
      if(k==='f'){
        var fams='yxda', i=fams.indexOf(p.fam); p.fam=fams[(i+1)%4];
        p.k = p.fam==='x' ? E.red05(M.nave.x) : p.fam==='y' ? E.red05(M.nave.y) : p.fam==='d' ? E.red05(M.nave.y-M.nave.x) : E.red05(M.nave.x+M.nave.y);
        Mv.acotar(p); refrescarPlan(); ev.preventDefault(); return;
      }
      if(k==='ArrowUp'||k==='ArrowRight'||k==='w'||k==='d'){ p.k+=paso; Mv.acotar(p); refrescarPlan(); ev.preventDefault(); return; }
      if(k==='ArrowDown'||k==='ArrowLeft'||k==='s'||k==='a'){ p.k-=paso; Mv.acotar(p); refrescarPlan(); ev.preventDefault(); return; }
    } else if(herr==='giro'){
      d=TECLAS_MOV[k];
      if(d){ p.centro=[p.centro[0]+d[0]*paso, p.centro[1]+d[1]*paso]; Mv.acotar(p); UI.centroTocado=true; refrescarPlan(); ev.preventDefault(); return; }
      if(k==='1'){ p.angulo=90; refrescarPlan(); return; }
      if(k==='2'){ p.angulo=180; refrescarPlan(); return; }
      if(k==='3'){ p.angulo=270; refrescarPlan(); return; }
      if(k==='r'){ p.angulo = p.angulo===90 ? 180 : (p.angulo===180 ? 270 : 90); refrescarPlan(); return; }
    } else if(herr==='vector'){
      d=TECLAS_MOV[k];
      if(d){ p.v=[p.v[0]+d[0]*paso, p.v[1]+d[1]*paso]; refrescarPlan(); ev.preventDefault(); return; }
    }
    return;
  }
  if(TECLAS_MOV[k]){ UI.teclas[k]=true; ev.preventDefault(); Sonido.despertar(); return; }
  if(k==='e') pedirPlan('espejo');
  else if(k==='g') pedirPlan('giro');
  else if(k==='v') pedirPlan('vector');
});
document.addEventListener('keyup', function(ev){ var k=teclaNorm(ev); if(TECLAS_MOV[k]) UI.teclas[k]=false; });
window.addEventListener('blur', function(){ UI.teclas={}; });
function actualizarMando(){
  var dx=0, dy=0;
  if(UI.joy.activo){ dx=UI.joy.dx; dy=UI.joy.dy; if(Math.hypot(dx,dy)<0.15){ dx=0; dy=0; } }
  else { for(var k in TECLAS_MOV){ if(UI.teclas[k]){ dx+=TECLAS_MOV[k][0]; dy+=TECLAS_MOV[k][1]; } } var L=Math.hypot(dx,dy); if(L>1){ dx/=L; dy/=L; } }

var NOMBRE_HERR={espejo:'espejo', giro:'giro', vector:'vector'};
function comboTexto(c){

function procesarEventos(){

  for(var i=0;i<lote.length;i++){
    var ev=lote[i];
    switch(ev.tipo){
      case 'oleada': {
        var def=ev.def, titulo=(def.jefe?'JEFE · ':'Oleada '+(ev.idx+1)+' · ')+def.nombre;
        var pista = (M.pistas && def.pista) ? def.pista : (ev.reinicio ? 'Otra vez: la oleada vuelve a empezar.' : (M.modo==='reto' ? 'Reto del día: sin pistas y con las formaciones reflejadas o giradas.' : ''));

        actualizarHerramientas(); cerrarPlan(); Sonido.congelar(false); Sonido.sfx(ev.reinicio?'fallo':'oleada'); UI.particulas.length=0;
        break; }
      case 'plan': abrirPlan(ev.herr); Sonido.sfx('plan'); Sonido.congelar(true); UI.bannerT=Math.min(UI.bannerT,0.4);
        anunciar('Tiempo congelado. '+({espejo:'Dibuja el eje del espejo.',giro:'Elige el centro y el ángulo del giro.',vector:'Elige el vector de la nave.'})[ev.herr]); break;
      case 'planCancelado': cerrarPlan(); Sonido.congelar(false); anunciar('Plan cancelado.'); break;
      case 'planCaducado': avisar('Se acabó el tiempo congelado: las balas vuelven a avanzar, despacio. Aplica o cancela.', 3); Sonido.sfx('fallo'); break;
      case 'aplicado': {

        var desc=Mv.describir(ev.iso), txt;

        if(ev.impactos>=12) b+=' · ¡devolución magistral!'; else if(nb>0 && ev.impactos===0) b+=' · ninguna ha tocado una torreta';
        banner('', b, 3); anunciar(b); break; }
      case 'impacto':
        if(!REDUCIDO) particulas(ev.x,ev.y,2,'#38e0f0',1.5);
        if(M.tiempo-UI.ultimoImpactoSfx>0.06 || M.tiempo<UI.ultimoImpactoSfx){ UI.ultimoImpactoSfx=M.tiempo; Sonido.sfx('impacto'); }
        break;
      case 'enemigoDestruido': particulas(ev.x,ev.y,26,'#f472b6',3); particulas(ev.x,ev.y,12,'#ffc229',2); Sonido.sfx('explosion'); UI.sacudida=Math.max(UI.sacudida,0.5); break;
      case 'golpe': Sonido.sfx('golpe'); UI.sacudida=1; particulas(M.nave.x,M.nave.y,14,'#ff5c5c',2.5); anunciar('Impacto. Casco '+ev.casco+' de 3.'); break;
      case 'vidaPerdida': { Sonido.sfx('vida'); var qv=(ev.vidas===1?'Queda 1 vida':'Quedan '+ev.vidas+' vidas'); banner('Nave perdida', qv+'. La oleada vuelve a empezar.', 3); anunciar('Nave perdida. '+qv+'.'); break; }
      case 'fin': cerrarPlan(); Sonido.congelar(false); Sonido.sfx('vida'); registrarRecord(); abrirPanel('fin'); break;
      case 'oleadaSuperada': {
        var t2='Oleada '+(ev.idx+1)+' superada', s2='+'+E.fmtPuntos(ev.bonus)+' puntos: '+ev.cargas+(ev.cargas===1?' carga':' cargas')+' sin usar'+(ev.golpes===0?' y ni un rasguño':'');
        banner(t2, s2, 2.4); anunciar(t2+'. '+s2); Sonido.sfx('oleada'); cerrarPlan(); Sonido.congelar(false); break; }
      case 'victoria': cerrarPlan(); Sonido.congelar(false); Sonido.sfx('combo'); registrarRecord(); abrirPanel('victoria'); break;

      case 'bloqueada': fallo('Esa herramienta se desbloquea en una oleada posterior.'); break;
      case 'sinCargas': fallo('Sin cargas. Recoge 4 cristales para recuperar una.'); break;

/* ---------------- récords ---------------- */
function registrarRecord(){
  var nuevo=false;
  if(M.modo==='reto'){
    var f=fechaClave(), ant=(progreso.reto && progreso.reto.fecha===f) ? progreso.reto.mejor : 0;
    nuevo = M.puntos>ant; progreso.reto={fecha:f, mejor:Math.max(ant,M.puntos)};
  } else {
    if(M.puntos>(progreso.mejor||0)){ progreso.mejor=M.puntos; nuevo=true; }
    progreso.mejorOleada=Math.max(progreso.mejorOleada||0, M.oleada+1);
  }
  if(M.fase==='victoria') progreso.victorias=(progreso.victorias||0)+1;
  guardar(); UI.recordNuevo=nuevo;
}
function textoRecords(){
  var partes=[];
  if(progreso.mejor) partes.push('Récord: '+E.fmtPuntos(progreso.mejor)+' puntos · oleada '+(progreso.mejorOleada||1)+'/'+E.OLEADAS.length);
  else partes.push('Sin récord todavía');
  if(progreso.victorias) partes.push('Mosaicos derrotados: '+progreso.victorias);
  if(progreso.reto && progreso.reto.fecha===fechaClave()) partes.push('Reto de hoy: '+E.fmtPuntos(progreso.reto.mejor));
  return partes.join(' · ');
}

/* ---------------- botones ---------------- */
$('bSonido').addEventListener('click', alternarSonido);
$('bPausa').addEventListener('click', alternarPausa);
$('bAyuda').addEventListener('click', function(){ if(UI.panel==='ayuda') return; UI.panelPrevio=UI.panel; if(!UI.panel && (M.fase==='jugando'||M.fase==='plan'||M.fase==='transicion')) UI.pausa=true; abrirPanel('ayuda'); });
[['bEspejo','espejo'],['bGiro','giro'],['bVector','vector']].forEach(function(par){ $(par[0]).addEventListener('click', function(){ pedirPlan(par[1]); }); });
Array.prototype.forEach.call($('planAngulos').querySelectorAll('button'), function(b){
  b.addEventListener('click', function(){
    if(M.fase!=='plan' || !UI.propuesta || UI.propuesta.tipo!=='giro') return;
    UI.propuesta.angulo=+b.getAttribute('data-ang'); refrescarPlan();
    if(!M.pizarra && UI.centroTocado){ aplicarPropuesta(); return; }
    if(M.pizarra) $('planEntrada').focus(); else $('bAplicar').focus();
  });
});
$('bAplicar').addEventListener('click', aplicarPropuesta);
$('bCancelar').addEventListener('click', function(){ M.cancelarPlan(); procesarEventos(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden && !UI.panel && (M.fase==='jugando'||M.fase==='plan'||M.fase==='transicion')) alternarPausa(); });
window.addEventListener('resize', ajustar);

/* ---------------- bucle ---------------- */
var prevTs=0, acc=0, H=1/120;
function tic(ts){
  requestAnimationFrame(tic);
  if(!prevTs) prevTs=ts; var dt=Math.min(0.05,(ts-prevTs)/1000); prevTs=ts;
  if(!UI.pausa && !UI.panel && (M.fase==='jugando'||M.fase==='plan'||M.fase==='transicion')){
    actualizarMando(); acc+=dt; var n=0;
    while(acc>=H && n<12){ M.paso(H); acc-=H; n++; }
    if(n>=12) acc=0;
    procesarEventos();
  }
  actualizarParticulas(dt);
  if(UI.sacudida>0) UI.sacudida=Math.max(0,UI.sacudida-dt*3);
  if(UI.flash>0) UI.flash=Math.max(0,UI.flash-dt*3);
  if(UI.bannerT>0){ UI.bannerT-=dt; if(UI.bannerT<=0) $('banner').classList.remove('visible'); }
  vaciarAvisos(ts/1000);
  if(M.fase==='plan' && M.plan) $('planMedidorBarra').style.width=clamp(M.plan.congelacion/K.CONGELACION*100,0,100).toFixed(1)+'%';
  dibujar(); actualizarHUD();
}
ajustar(); actualizarHerramientas(); abrirPanel('menu');
requestAnimationFrame(tic);

/* ganchos de verificación: avanzar la física a mano cuando el panel del navegador está oculto */
function avanzar(segundos){
  var n=Math.max(1,Math.round((segundos||1)/H));
  for(var i=0;i<n;i++){ if(!(M.fase==='jugando'||M.fase==='plan'||M.fase==='transicion')) break; actualizarMando(); M.paso(H); if(M.eventos.length>40) procesarEventos(); }
  procesarEventos(); actualizarParticulas(segundos||1); dibujar(); actualizarHUD(); tUltimoAviso=-9; vaciarAvisos(0);
}
window.__espejo={ M:M, UI:UI, E:E, iniciar:iniciar, pedirPlan:pedirPlan, aplicarPropuesta:aplicarPropuesta, abrirPanel:abrirPanel, cerrarPanel:cerrarPanel, procesarEventos:procesarEventos, ajustar:ajustar, Sonido:Sonido, avanzar:avanzar, dibujar:dibujar, refrescarPlan:refrescarPlan };
})();
</script>
</body>
</html>
