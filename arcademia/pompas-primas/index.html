<!--
  Juego: Pompas Primas — la vuelta a Asturias de los números compuestos
  Autor: Mario Rodríguez Boya (© 2026). Licencia CC BY-NC-ND 4.0
  (https://creativecommons.org/licenses/by-nc-nd/4.0/deed.es): se puede usar y
  compartir citando al autor, sin fines comerciales y sin modificarlo.
  Curso: 1.º y 2.º ESO · Tema: Divisibilidad — descomposición en factores
  primos, primos y compuestos, y m.c.d. y m.c.m. (el mundo de Llanes, con las
  pompas gemelas).
  Aprende esto en…: sin enlace todavía (la divisibilidad de 1.º ESO no tiene
  apuntes publicados).
  Origen: idea del profesor (2026-09-30), un juego como el Pang clásico en el
  que las bolas son números que se descomponen; diseñado y construido en
  Arcademia el mismo día. Autocontenido: canvas y WebAudio nativos, sin
  dependencias externas ni webfonts.
  Mecánica: el alumno no decide nada matemático y no puede equivocarse con los
  números; solo juega, y ve la descomposición. Cada pompa lleva un número. Al
  darle con el arpón, una pompa compuesta se parte en dos pompas cuyo producto
  es ella, y una pompa prima estalla. El reparto depende de dónde le da el
  arpón (idea del profesor): de lleno en el centro, en la pareja más igualada
  (60 = 6 · 10); cuanto más de lado, más pequeña es la que sale por ese lado,
  hasta el primo más pequeño (60 = 2 · 30). Así se ve que cualquier camino
  acaba en los mismos primos. El diámetro de cada pompa
  es proporcional al logaritmo de su número (más una constante, para que el 2
  se lea en un móvil), así que las dos hijas caben casi justas en la madre.
  Aspecto del Pang clásico: figuras en píxeles gordos, de unos 390 puntos de
  ancho de campo, colocadas con la precisión de la pantalla para que nada se
  mueva a saltos; bolas macizas con su brillo y su estallido, cifras de
  máquina recreativa, el explorador con salacot (de frente parado, de perfil
  al andar y de espaldas al disparar), el arpón de cuerda en espiral, un marco
  de bloques y el marcador debajo. Los fondos se pintan con el doble de
  detalle, con cielos tramados y bordes iluminados; se mueven, suaves, las
  nubes a dos velocidades y un detalle de cada sitio (gaviotas, olas, humo, la
  cascada, un águila, las estrellas y los fuegos). Un golpe quita una vida,
  pero la fase sigue.
  Arriba, una línea por pompa madre se reescribe con cada disparo y siempre es
  cierta (60 = 6 · 10 → 60 = 2 · 3 · 10 → … → 60 = 2² · 3 · 5). Primos y
  compuestos se ven iguales hasta que se les dispara. Al estallar el último
  primo repetido de un número sale su potencia (con el tercer 2 de 72, 2³).
  Ocho objetos, como en el Pang: doble arpón, arpón fijo, reloj, escudo,
  dinamita, lupa, criba y la ráfaga, que dispara balitas mientras se
  mantiene pulsado el disparo. Las pompas gemelas de
  Llanes (dos números pegados, como un diagrama de Venn) se parten en tres: lo
  que solo es del primero, lo común (el m.c.d.) y lo que solo es del segundo;
  las tres multiplicadas dan el m.c.m. Doce lugares de Asturias con cuatro
  fases cada uno, criba infinita (los números salen en orden, 2, 3, 4…), reto
  del día por fecha, dos jugadores en el mismo teclado y modo tranquilo.
  Estructura: el bloque de script «logica» es lógica pura sin DOM (aritmética,
  repartos, campaña, reto y motor con la física) y se ejecuta tal cual en jsc
  para el barrido de verificación (verificacion/pompas-primas/); el bloque
  «interfaz» es el canvas, los fondos, los mandos, el sonido y los paneles.
-->
<style>
:root{
  --negro:#000; --panel:#0a0a22; --panel-2:#141444; --borde:#2f4bd8; --borde-2:#8ca0ff;
  --tinta:#ffffff; --tinta-2:#b9c3ff; --sol:#ffd400; --sol-2:#ffe766; --rojo:#ff3b2f; --turquesa:#41e0c8;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --arcade: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  --titulo: "Arial Black", "Arial Rounded MT Bold", Impact, system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; height:100%; overflow:hidden}
body{background:#000; color:var(--tinta); font-family:var(--ui); user-select:none; -webkit-user-select:none; touch-action:manipulation}
#app{display:flex; flex-direction:column; height:100dvh; width:100%; max-width:1040px; margin:0 auto; position:relative; background:#000;
  padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- barra superior ---------- */
#superior{display:flex; align-items:center; gap:8px; padding:6px 8px; flex:0 0 auto; background:#000; border-bottom:2px solid var(--borde)}
#rotulo{display:flex; flex-direction:column; min-width:0; margin-right:auto; overflow:hidden}
#rotulo .n{font:700 10px/1.1 var(--arcade); letter-spacing:.14em; text-transform:uppercase; color:var(--turquesa)}
#rotulo .t{font:900 20px/1.1 var(--titulo); letter-spacing:.04em; color:var(--sol); white-space:nowrap;
  text-shadow:-1px -1px 0 #b00000, 1px -1px 0 #b00000, -1px 1px 0 #b00000, 2px 2px 0 #b00000, 3px 3px 0 #4a0000}
#botonera{display:flex; gap:6px}
.icobtn{width:38px; height:38px; border-radius:6px; border:2px solid var(--borde); background:#05051a; color:var(--sol);
  font:800 16px var(--ui); display:grid; place-items:center; cursor:pointer; text-decoration:none; padding:0; box-shadow:inset 0 -3px 0 #000}
.icobtn[aria-pressed="false"]{opacity:.55}
.icobtn:hover,.icobtn:focus-visible{background:var(--sol); color:#05051a}

/* ---------- líneas de las descomposiciones ---------- */
#lineas{flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:4px 18px; padding:4px 8px; min-height:36px; background:#000; border-bottom:2px solid #151545}
.linea{display:inline-flex; flex-wrap:wrap; align-items:center; gap:3px 4px; font:900 15px/1.25 var(--arcade); color:var(--tinta); min-height:26px; max-width:100%}
.linea .igual,.linea .por,.linea .y{color:var(--tinta-2)}
.mini{display:inline-grid; place-items:center; min-width:24px; height:24px; padding:0 6px; border-radius:12px; border:2px solid #111;
  color:#fff; font:900 13px var(--arcade); text-shadow:1px 1px 0 #000}
.mini.f0{background:radial-gradient(circle at 32% 28%, #ffffff 0 12%, #ff8a70 13% 30%, #e8312a 31% 70%, #a3140e 71%)}
.mini.f1{background:radial-gradient(circle at 32% 28%, #ffffff 0 12%, #8cc0ff 13% 30%, #2f7cf0 31% 70%, #1646a8 71%)}
.mini.f2{background:radial-gradient(circle at 32% 28%, #ffffff 0 12%, #98ec9e 13% 30%, #2fbf4c 31% 70%, #14782c 71%)}
.mini.f3{background:radial-gradient(circle at 32% 28%, #ffffff 0 12%, #ffe08a 13% 30%, #f7a928 31% 70%, #b06a06 71%)}
.mini.hecha{border-color:transparent; background:none; color:var(--sol); padding:0 1px; min-width:0; text-shadow:none}
.mini.pulso{animation:destello .45s ease-out}
.linea.completa .final{color:var(--sol)}
.linea .ok{color:var(--turquesa); font-weight:900}
.linea.doble{gap:6px}
.linea svg{display:block; flex:0 0 auto; font-family:var(--arcade)}
.chip{display:inline-block; font:900 13px/1.2 var(--arcade); color:#000; background:var(--turquesa); border-radius:4px; padding:2px 8px}
.chip.m{background:var(--sol)}

/* ---------- escenario ---------- */
#escenario{position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:4px}
canvas{display:block; touch-action:none; outline:none; image-rendering:pixelated; image-rendering:crisp-edges}
canvas:focus-visible{box-shadow:0 0 0 3px #fff}
.vuelo{position:absolute; z-index:5; pointer-events:none; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; display:grid; place-items:center;
  font:900 13px var(--arcade); color:#3a2604; background:radial-gradient(circle at 32% 28%, #fff 0 14%, #ffd24a 15% 70%, #c98a10 71%); border:2px solid #3a2604;
  transition:transform .5s cubic-bezier(.3,.7,.4,1), opacity .5s}

/* ---------- marcador, debajo del campo como en el Pang ---------- */
#hud{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:4px; padding:3px 8px; flex:0 0 auto; background:#000; border-top:2px solid var(--borde)}
.celda{display:flex; flex-direction:column; align-items:center; min-width:0}
.celda .eti{font:700 10px/1.1 var(--arcade); letter-spacing:.1em; text-transform:uppercase; color:var(--rojo); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.celda .val{font:900 17px/1.25 var(--arcade); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
#hFase{font-size:15px}
#hPuntos{color:var(--sol)}
#hVidas{color:var(--rojo); letter-spacing:.02em}
#hTiempo.apuro{color:var(--rojo); animation:latido .9s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.15)}}
.val.destello{animation:destello .45s ease-out}
@keyframes destello{0%{transform:scale(1.25); filter:brightness(1.8)} 100%{transform:scale(1); filter:none}}

/* ---------- mandos táctiles ---------- */
#mandos{flex:0 0 auto; display:grid; grid-template-columns:2fr 1.6fr; gap:8px; padding:6px 8px 8px; background:#000; border-top:2px solid #151545}
#mandos[hidden]{display:none}
#flechas{display:grid; grid-template-columns:1fr 1fr; gap:8px; touch-action:none}
.mando{min-height:62px; border-radius:10px; border:2px solid var(--borde); background:linear-gradient(#1a1a5a,#0a0a2a); color:var(--sol);
  font:900 24px var(--ui); cursor:pointer; touch-action:none; box-shadow:inset 0 -4px 0 #000}
.mando.disparo{font:900 18px var(--titulo); letter-spacing:.04em; background:linear-gradient(#ff5a4a,#c01010); color:#fff; border-color:#ffb0a0}
.mando:active,.mando.pulsado{transform:translateY(2px); box-shadow:inset 0 -1px 0 #000}
.mando:focus-visible{outline:3px solid #fff; outline-offset:2px}

/* ---------- botones y paneles ---------- */
.btn{flex:1 1 auto; border:2px solid var(--borde); border-radius:6px; background:#05051a; color:var(--sol); font:800 14px var(--ui);
  padding:8px 10px; cursor:pointer; min-height:40px}
.btn:hover,.btn:focus-visible{background:var(--sol); color:#05051a}
.btn.secundario{color:var(--tinta-2)}
.btn.secundario:hover,.btn.secundario:focus-visible{color:#05051a}
.btn.principal{background:var(--rojo); color:#fff; border-color:#ffb0a0; font-family:var(--titulo); letter-spacing:.04em}
.btn.principal:hover,.btn.principal:focus-visible{background:var(--sol); color:#05051a; border-color:var(--sol)}
.btn[aria-pressed="true"]{background:var(--turquesa); color:#03231e; border-color:var(--turquesa)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
#aviso{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
#velo{position:absolute; inset:0; background:rgba(0,0,0,.84); display:flex; align-items:center; justify-content:center; padding:12px; z-index:10; overflow:auto}
#velo[hidden]{display:none}
.panel{width:100%; max-width:520px; background:var(--panel); border:3px solid var(--borde-2); outline:3px solid var(--borde); border-radius:4px; padding:16px;
  box-shadow:0 0 0 6px #000, 0 0 30px rgba(47,75,216,.5); max-height:100%; overflow:auto}
.panel h2{margin:0 0 6px; font:900 26px/1.1 var(--titulo); letter-spacing:.03em; color:var(--sol); text-align:center;
  text-shadow:-1px -1px 0 #b00000, 1px -1px 0 #b00000, -1px 1px 0 #b00000, 2px 2px 0 #b00000, 3px 3px 0 #4a0000}
.panel h2.logo{font-size:36px; line-height:1.05; margin-bottom:10px}
.panel h3{margin:12px 0 4px; font:800 12px var(--arcade); letter-spacing:.12em; text-transform:uppercase; color:var(--turquesa)}
.panel p{margin:6px 0; font:500 14px/1.45 var(--ui); color:var(--tinta)}
.panel .sub{text-align:center; color:var(--tinta-2); font-size:13px}
.panel .fila{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.panel .fila .btn{flex:1 1 140px}
.panel .opciones{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:4px}
.panel .opciones.dos{grid-template-columns:repeat(2, 1fr)}
.panel .opciones .btn{padding:6px 4px; font-size:13px; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px}
.panel .opciones .btn small{font:600 10.5px/1.2 var(--ui); color:inherit; opacity:.85}
.panel ul{margin:4px 0; padding-left:18px; font:500 13px/1.45 var(--ui)}
.panel li{margin:3px 0}
.panel b{color:var(--sol)}
.panel .cifra{font:900 34px/1.1 var(--arcade); color:var(--sol); text-align:center; margin:6px 0}
.panel .cifra.pequena{font-size:22px}
.panel .recor{font:700 13px/1.4 var(--ui); color:var(--tinta-2); text-align:center; margin-top:8px}
.panel .aviso-sesion{font:800 13px/1.4 var(--ui); color:var(--turquesa); text-align:center; margin-top:6px}
.mundos{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:6px}
.mundos .btn{padding:6px 2px; font-size:11.5px; line-height:1.15; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0}
.mundos .btn small{font:600 10px/1.15 var(--ui); color:inherit; opacity:.85}
.tabla{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font:500 13px/1.4 var(--ui); margin:6px 0}
.tabla b{font:800 13px var(--arcade); color:var(--sol); text-align:right}
.arboles{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:8px 0}
.arboles figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; max-width:100%; overflow-x:auto}
.arboles figcaption{font:900 14px/1.3 var(--arcade); color:var(--sol); text-align:center}
.arboles svg{display:block; max-width:100%; height:auto; font-family:var(--arcade)}
.criba{display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; margin:8px 0}
.criba span{display:grid; place-items:center; aspect-ratio:1; border-radius:4px; font:900 12px var(--arcade); color:var(--tinta-2); border:1px dashed rgba(185,195,255,.35)}
.criba span.p{border:2px solid var(--sol); border-radius:50%; color:var(--sol); background:rgba(255,212,0,.12)}
.criba span.c{border:1px solid transparent; color:rgba(185,195,255,.55); text-decoration:line-through; text-decoration-thickness:2px}
.leyenda{display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; font:600 12px var(--ui); color:var(--tinta-2)}
.leyenda i{display:inline-grid; place-items:center; width:20px; height:20px; margin-right:4px; font:800 11px var(--arcade); font-style:normal; vertical-align:middle}
.leyenda i.p{border:2px solid var(--sol); border-radius:50%; color:var(--sol)}
.leyenda i.c{text-decoration:line-through; color:rgba(185,195,255,.6)}
.leyenda i.s{border:1px dashed rgba(185,195,255,.5); border-radius:4px}
.pie-marca{margin-top:12px; text-align:center; font:600 12px var(--ui); color:var(--tinta-2)}
.pie-marca a{color:var(--turquesa)}
.pie-licencia{margin-top:4px}
.icobtn:focus-visible,.btn:focus-visible,.pie-marca a:focus-visible{outline:3px solid #ffffff; outline-offset:2px}

@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
@media (max-width:420px){ #rotulo .t{font-size:17px; letter-spacing:.02em} #rotulo .n{font-size:9px} .linea{font-size:14px} .mini{min-width:22px; height:22px; font-size:12px; padding:0 5px}
  .mundos{grid-template-columns:repeat(2, 1fr)} .panel h2.logo{font-size:30px} .celda .val{font-size:15px} }
@media (max-height:640px){ .mando{min-height:52px} #hud .val{font-size:14px} }
/* móvil en horizontal: las flechas a la izquierda del campo, el arpón a la derecha y la cabecera más baja */
@media (orientation:landscape) and (max-height:520px){
  #superior{padding:2px 8px} .icobtn{width:30px; height:30px; font-size:13px} #rotulo .t{font-size:15px} #rotulo .n{font-size:8px}
  #hud{padding:0 8px} .celda .eti{font-size:8px} .celda .val{font-size:13px; line-height:1.15} #hFase{font-size:12px}
  #lineas{min-height:28px; padding:2px 8px} .linea{font-size:13px; min-height:22px} .mini{height:20px; min-width:20px; font-size:11.5px}
  #app.tactil{display:grid; max-width:none; grid-template-columns:96px minmax(0, 1fr) 96px; grid-template-rows:auto auto minmax(0, 1fr) auto;
    grid-template-areas:"sup sup sup" "lin lin lin" "fle esc dis" "hud hud hud"}
  #app.tactil #superior{grid-area:sup} #app.tactil #hud{grid-area:hud} #app.tactil #lineas{grid-area:lin} #app.tactil #escenario{grid-area:esc}
  #app.tactil #mandos{display:contents}
  #app.tactil #flechas{grid-area:fle; display:flex; flex-direction:column; justify-content:flex-end; gap:8px; padding:6px}
  #app.tactil #bDisparo{grid-area:dis; align-self:end; margin:6px; min-height:110px; font-size:15px}
  #app.tactil .mando{min-height:64px}
}
</style>
</head>
<body>
<div id="app">
  <header id="superior">
    <a class="icobtn" id="bVolver" href="../index.html" aria-label="Volver al salón Arcademia" title="Volver a Arcademia">←</a>
    <div id="rotulo"><span class="n">Números · 1.º y 2.º ESO</span><span class="t">POMPAS PRIMAS</span></div>
    <div id="botonera">
      <button type="button" class="icobtn" id="bSonido" aria-pressed="true" aria-label="Sonido" title="Sonido (M)">🔊</button>
      <button type="button" class="icobtn" id="bPausa" aria-label="Pausa" title="Pausa (P)">⏸</button>
      <button type="button" class="icobtn" id="bAyuda" aria-label="Cómo se juega" title="Cómo se juega (?)">?</button>
    </div>
  </header>

  <div id="lineas" role="list" aria-label="Descomposiciones de las pompas"></div>

  <div id="escenario">
    <canvas id="lienzo" tabindex="0" role="img" aria-label="El campo de juego: pompas con números que botan; mueve al explorador y dispara el arpón hacia arriba. Pulsa L para saber qué pompas hay y dónde."></canvas>
  </div>

  <div id="hud" role="group" aria-label="Marcador">
    <div class="celda"><span class="eti" id="hFaseEti">Fase</span><span class="val" id="hFase">–</span></div>
    <div class="celda"><span class="eti">Vidas</span><span class="val" id="hVidas" role="img" aria-label="3 vidas">♥♥♥</span></div>
    <div class="celda"><span class="eti">Puntos</span><span class="val" id="hPuntos">0</span></div>
    <div class="celda"><span class="eti" id="hTiempoEti">Tiempo</span><span class="val" id="hTiempo">–</span></div>
  </div>

  <div id="mandos" role="group" aria-label="Mandos táctiles" hidden>
    <div id="flechas">
      <button type="button" class="mando" id="bIzq" aria-label="Moverse a la izquierda">◀</button>
      <button type="button" class="mando" id="bDer" aria-label="Moverse a la derecha">▶</button>
    </div>
    <button type="button" class="mando disparo" id="bDisparo" aria-label="Disparar el arpón">¡ARPÓN!</button>
  </div>

  <div id="aviso" role="status" aria-live="polite"></div>
  <div id="velo"><div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitulo"></div></div>
</div>

<script id="logica">
/* @@LOGICA-INICIO — lógica pura de Pompas Primas, sin DOM (se ejecuta tal cual en jsc) */
var POMPAS = (function(){
"use strict";
/* el campo mide 720 × 480, con la y hacia abajo: el techo está en y = 0 y el suelo en y = 440 */
var W = 720, H = 480, SUELO = 440;
var G = 460;                        /* gravedad, en unidades por segundo al cuadrado */
var VX = 88;                        /* velocidad horizontal de las pompas */
/* diámetro = D_A + D_B · ln n: el 2 mide 34 y el 100, 154; con el logaritmo, las dos hijas caben casi justas
   dentro de la madre (les sobra D_A, lo justo para que el 2 se lea en un móvil de 375 px) */
var D_A = 12.74, D_B = 30.67;
var BOTE_MIN = 110, BOTE_K = 0.95, MARGEN_TECHO = 20;   /* cuánto sube cada pompa sobre el suelo al botar */
var SALTO_HIJAS = 48;               /* al partirse, las hijas dan un saltito hacia arriba */
var JUG_VEL = 210, JUG_ANCHO = 36, JUG_ALTO = 56;
var CAJA_ANCHO = 20, CAJA_ALTO = 42, HOLGURA = 4;   /* la caja que choca con las pompas, algo menor que el dibujo, y lo que perdona el borde de la pompa */
var JUG_MIN = 22, JUG_MAX = W - 22;
var ARPON_VEL = 800, ARPON_INICIO = SUELO - JUG_ALTO;
var T_FIJO = 2.5, T_RELOJ = 5, T_LUPA = 8, T_OBJETO = 7, P_OBJETO = 0.14, T_INVULNERABLE = 1.5, T_TRAS_GOLPE = 2.2;
var T_PREPARADOS = 1.4, T_GOLPE = 1.2;
var T_RAFAGA = 8, T_BALA = 0.1, BALA_VEL = 900, BALAS_MAX = 8;   /* la ráfaga del Pang: con el disparo pulsado, una balita cada 0,1 s durante 8 s */

/* ---------- aritmética ---------- */
function esPrimo(n){
  if(n < 2 || n !== Math.floor(n)) return false;
  if(n % 2 === 0) return n === 2;
  for(var d = 3; d * d <= n; d += 2) if(n % d === 0) return false;
  return true;
}
function factoriza(n){
  var f = [], d = 2;
  while(n > 1 && d * d <= n){
    var e = 0; while(n % d === 0){ n /= d; e++; }
    if(e) f.push([d, e]);
    d += (d === 2 ? 1 : 2);
  }
  if(n > 1) f.push([n, 1]);
  return f;
}
function primosDe(n){ var out = []; factoriza(n).forEach(function(f){ for(var i = 0; i < f[1]; i++) out.push(f[0]); }); return out; }
function omega(n){ return n < 2 ? 0 : primosDe(n).length; }
function exponente(e){ return String(e).split('').map(function(c){ return SUP[c]; }).join(''); }
function textoFactorizacion(n, sep){
  if(n === 1) return '1';
  return factoriza(n).map(function(f){ return f[1] > 1 ? f[0] + exponente(f[1]) : String(f[0]); }).join(sep || ' · ');
}
function mcd(a, b){ a = Math.abs(a); b = Math.abs(b); while(b){ var t = a % b; a = b; b = t; } return a; }

/* todas las formas de escribir n = a · b con 2 ≤ a ≤ b, de la más desigual a la más igualada */
function parejas(n){ var out = []; for(var a = 2; a * a <= n; a++) if(n % a === 0) out.push([a, n / a]); return out; }
/* cómo se parte una pompa según dónde le da el arpón: t = 0 es de lleno en el centro y da la pareja más igualada
   (60 = 6 · 10); t = 1 es rozando el borde y da el primo más pequeño (60 = 2 · 30); en medio, las parejas de en medio.
   Devuelve [menor, mayor]; la menor sale por el lado del golpe */
function repartoPorGolpe(n, t){
  var P = parejas(n); if(!P.length) return null;
  var k = P.length, i = k - 1 - Math.min(k - 1, Math.floor(clamp(t, 0, 1) * k));
  return P[i];
}
/* las pompas gemelas a|b se parten en tres: lo que solo es de a, lo común (el m.c.d.) y lo que solo es de b;
   las tres multiplicadas dan el m.c.m. Un 1 significa que esa parte no existe */
function repartoDoble(a, b){ var g = mcd(a, b); return { izq:a / g, com:g, der:b / g }; }
function diametro(n){ return D_A + D_B * Math.log(n); }
function alturaBote(d){ return Math.max(60, Math.min(BOTE_MIN + BOTE_K * (d - 34), SUELO - MARGEN_TECHO - d)); }
function disparosDe(n){ return n < 2 ? 0 : 2 * omega(n) - 1; }
function disparosDoble(a, b){ var R = repartoDoble(a, b); return 1 + disparosDe(R.izq) + disparosDe(R.com) + disparosDe(R.der); }
function fmtPuntos(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------- árboles: cada pompa es una hoja; al partirse, le salen dos hijas ---------- */
function nodo(n){ return { n:n, hijos:null, hecho:false, id:0 }; }
function hojas(nd, out){
  out = out || [];
  if(!nd) return out;
  if(nd.hijos){ hojas(nd.hijos[0], out); hojas(nd.hijos[1], out); } else out.push(nd);
  return out;
}
function hojasDoble(raiz){ return { izq:hojas(raiz.izq), com:hojas(raiz.com), der:hojas(raiz.der) }; }
function textoFamilia(f){
  var R = f.raiz;
  if(f.tipo === 'doble'){
    var a = R.a, b = R.b, g = mcd(a, b), m = mcm(a, b);
    if(!R.partida) return a + ' y ' + b;
    if(f.completa){
      return 'm.c.d.(' + a + ', ' + b + ') = ' + (g > 1 && !esPrimo(g) ? textoFactorizacion(g) + ' = ' : '') + g
        + '; m.c.m.(' + a + ', ' + b + ') = ' + (esPrimo(m) ? '' : textoFactorizacion(m) + ' = ') + m;
    }
    var H2 = hojasDoble(R), num = function(h){ return h.n; };
    var ladoA = H2.izq.concat(H2.com).map(num), ladoB = H2.com.concat(H2.der).map(num);
    return a + ' = ' + (ladoA.length ? ladoA.join(' · ') : '1') + ' y ' + b + ' = ' + (ladoB.length ? ladoB.join(' · ') : '1');
  }
  if(f.completa) return esPrimo(R.n) ? R.n + ' es primo' : R.n + ' = ' + textoFactorizacion(R.n);
  if(!R.hijos) return String(R.n);
  return R.n + ' = ' + hojas(R).map(function(h){ return h.n; }).join(' · ');
}

/* ---------- reto del día: cinco fases sacadas de la fecha ---------- */
function compuestos(min, max, o1, o2){ var L = []; for(var n = min; n <= max; n++) if(!esPrimo(n)){ var o = omega(n); if(o >= o1 && o <= o2) L.push(n); } return L; }
function generarGemelas(rng){
  for(var t = 0; t < 1000; t++){
    var g = 2 + Math.floor(rng() * 11), x = 1 + Math.floor(rng() * 8), y = 1 + Math.floor(rng() * 8);
    if(x === y || mcd(x, y) !== 1) continue;
    var a = g * x, b = g * y;
    if(a > 60 || b > 60 || a < 6 || b < 6) continue;
    return a < b ? [a, b] : [b, a];
  }
  return [12, 18];
}
function generarReto(semilla){
  var rng = mulberry32((semilla >>> 0) || 1);
  function elige(L){ return L[Math.floor(rng() * L.length)]; }
  var impostores = [], primosGrandes = [], n;
  for(n = 49; n <= 221; n += 2) if(!esPrimo(n) && n % 5 !== 0) impostores.push(n);
  for(n = 53; n <= 199; n++) if(esPrimo(n)) primosGrandes.push(n);
  var base = Math.floor(rng() * MUNDOS.length), fases = [];
  /* dos pompas a los lados, sorteando cuál va a cada lado: que el lado no delate la prima ni el impostor */
  function lados(a, b){ var q = [{ n:a, x:0.22, dir:-1 }, { n:b, x:0.78, dir:1 }]; if(rng() < 0.5){ q[0].n = b; q[1].n = a; } return q; }
  var L1 = compuestos(12, 40, 2, 3), a1 = elige(L1), b1 = a1;
  while(b1 === a1) b1 = elige(L1);
  fases.push({ mundo:base % MUNDOS.length, pompas:lados(a1, b1) });
  fases.push({ mundo:(base + 1) % MUNDOS.length, pompas:lados(elige(compuestos(40, 100, 4, 4)), elige(impostores)) });
  var par = generarGemelas(rng);
  fases.push({ mundo:(base + 2) % MUNDOS.length, pompas:[{ a:par[0], b:par[1], x:0.3, dir:-1 }] });
  fases.push({ mundo:(base + 3) % MUNDOS.length, pompas:lados(elige(compuestos(60, 200, 3, 5)), elige(primosGrandes)) });
  fases.push({ mundo:(base + 4) % MUNDOS.length, pompas:[{ n:elige(compuestos(200, 1000, 5, 6)), x:0.27, dir:-1 }] });
  return fases;
}

  var rng = mulberry32(1), sigId = 1, sigFam = 1;

  function estadNueva(){ return { disparos:0, roturas:0, primos:0, familias:0, potencias:0, objetos:0, golpes:0, fases:0 }; }
  function quitar(p){ var i = M.pompas.indexOf(p); if(i >= 0) M.pompas.splice(i, 1); }
  function familia(id){ for(var i = 0; i < M.familias.length; i++) if(M.familias[i].id === id) return M.familias[i]; return null; }

  /* geometría */
  function geomDoble(p){ var D = p.rA + p.rB - SOLAPE_DOBLE * Math.min(p.rA, p.rB); return { xA:p.x - D / 2, xB:p.x + D / 2, D:D }; }

  function extDer(p){ if(!p.doble) return p.x + p.r; return geomDoble(p).xB + p.rB; }
  function radioMax(p){ return p.doble ? Math.max(p.rA, p.rB) : p.r; }
  function velBote(p){ return Math.sqrt(2 * G * alturaBote(2 * radioMax(p))); }
  function encajar(p){
    var i = extIzq(p); if(i < 0) p.x -= i;
    var d = extDer(p); if(d > W) p.x -= (d - W);

    encajar(p); M.pompas.push(p); nd.id = p.id; return p;
  }
  function crearDoble(a, b, x, y, vx, vy, fam){
    var dA = diametro(a), dB = diametro(b);
    var p = { id:sigId++, doble:true, a:a, b:b, dA:dA, dB:dB, rA:dA / 2, rB:dB / 2, x:x, y:y, vx:vx, vy:vy, fam:fam, tBote:-9, nace:M.t };
    p.r = Math.max(p.rA, p.rB);

  }
  function nuevaFamilia(tipo, q){
    var f = { id:sigFam++, tipo:tipo, completa:false, tCompleta:-9, tInicio:M.t };
    f.raiz = tipo === 'doble' ? { doble:true, a:q.a, b:q.b, izq:null, com:null, der:null, partida:false } : nodo(q.n);

    var f = familia(fid); if(!f || f.completa || !familiaHecha(f)) return;
    f.completa = true; f.tCompleta = M.t;

    M.puntos += valor; M.estad.familias++;
    emitir('familia', { fam:f.id, texto:textoFamilia(f), valor:valor, doble:f.tipo === 'doble', primos:f.tipo === 'doble' ? primosDe(mcm(f.raiz.a, f.raiz.b)) : primosDe(f.raiz.n) });
  }
  function hojasPendientes(){ return M.pompas.reduce(function(s, p){ return s + (p.doble ? omega(mcm(p.a, p.b)) : omega(p.n)); }, 0); }

  /* jugadores */
  function jugador(i, x){ return { i:i, x:x, dir:0, objetivo:null, vx:0, arma:'simple', arpones:[], escudo:false, invulnerable:0, rafaga:0, gatillo:false, tBala:0, balas:[] }; }
  function crearJugadores(){ return M.nJug === 2 ? [jugador(0, W * 0.4), jugador(1, W * 0.6)] : [jugador(0, W / 2)]; }

  /* partidas y fases */
  M.nuevaPartida = function(modo, op){

    M.modo = modo || 'campana';
    M.tranquilo = !!op.tranquilo; M.nJug = op.jugadores === 2 ? 2 : 1;
    M.semilla = (op.semilla >>> 0) || 1; M.anio = (op.anio >= 2 && op.anio === Math.floor(op.anio)) ? op.anio : 2026;

function listaTexto(L){ if(L.length <= 1) return L.join(''); return L.slice(0, -1).join(', ') + ' y ' + L[L.length - 1]; }

/* ---------------- récords ---------------- */
function registrarFin(){
  UI.recordNuevo = false;
  if(M.modo === 'campana'){ if(M.puntos > progreso.mejor){ progreso.mejor = M.puntos; UI.recordNuevo = true; } }
  else if(M.modo === 'criba'){ var C = M.criba; if(C && C.max > progreso.cribaMax){ progreso.cribaMax = C.max; UI.recordNuevo = true; } }
  else registrarReto();
  guardar();
}
function registrarVictoria(ev){
  UI.recordNuevo = false;
  if(M.modo === 'campana'){ if(ev.entera){ progreso.victorias++; } progreso.mundoMax = E.MUNDOS.length - 1; if(M.puntos > progreso.mejor){ progreso.mejor = M.puntos; UI.recordNuevo = true; } }
  else registrarReto();
  guardar();
}
function registrarReto(){ var f = fechaClave(), ant = (progreso.reto && progreso.reto.fecha === f) ? (progreso.reto.mejor || 0) : 0; UI.recordNuevo = M.puntos > ant; progreso.reto = { fecha:f, mejor:Math.max(ant, M.puntos) }; }
function textoRecords(){
  var p = [];
  p.push(progreso.mejor ? 'Récord: ' + E.fmtPuntos(progreso.mejor) + ' puntos' : 'Sin récord todavía');
  if(progreso.victorias) p.push('vueltas enteras a Asturias: ' + progreso.victorias);
  if(progreso.cribaMax) p.push('criba hasta el ' + progreso.cribaMax);
  if(progreso.reto && progreso.reto.fecha === fechaClave()) p.push('reto de hoy: ' + E.fmtPuntos(progreso.reto.mejor || 0));
  return p.join(' · ');
}

  alClic('mReintentar', function(){ cerrarPanel(); limpiarEfectos(); M.reintentarFase(); procesarEventos(); enfocarLienzo(); });

  Array.prototype.forEach.call(p.querySelectorAll('[data-mundo]'), function(bt){ bt.addEventListener('click', function(ev){ if(ev.detail === 0 && performance.now() - UI.tPanel < 700) return; iniciar('campana', +bt.getAttribute('data-mundo') * E.FASES_POR_MUNDO); }); });
  var objetivo = (focoId && $(focoId)) || p.querySelector('.btn.principal:not([disabled])') || p.querySelector('button:not([disabled])');
  if(objetivo) setTimeout(function(){ if(UI.panel === nombre) objetivo.focus(); }, 30);
}
function cerrarPanel(){
  UI.panel = null; $('velo').hidden = true; $('panel').innerHTML = ''; bloquearFondo(false);
  var f = UI.focoPrevio; UI.focoPrevio = null;
  if(f && f.focus && document.contains(f) && f !== document.body){ try{ f.focus({ preventScroll:true }); }catch(e){} }
}
function cerrarPanelVolver(){
  if(UI.panel === 'ayuda'){
    var prev = UI.panelPrevio; UI.panelPrevio = null;
    if(prev && prev !== 'ayuda' && prev !== 'juego'){ abrirPanel(prev); return; }
    cerrarPanel(); UI.pausa = false;
    if(M.fase === 'menu') abrirPanel('menu'); else enfocarLienzo();
    return;
  }
  if(UI.panel === 'pausa') UI.pausa = false;
  cerrarPanel();
  if(M.fase === 'menu') abrirPanel('menu'); else enfocarLienzo();
}
function irAlMenu(){ M.fase = 'menu'; M.pompas = []; M.objetos = []; M.familias = []; M.jugadores = []; UI.pausa = false; UI.tPanelSuperada = -1; UI.banner = null; limpiarEfectos(); $('lineas').style.minHeight = ''; UI.altoLineas = 0; UI.firmaLineas = null; renderLineas(); ajustar(); abrirPanel('menu'); }
function abrirAyudaDesdeJuego(){
  if(UI.panel === 'ayuda') return;
  UI.panelPrevio = UI.panel || 'juego';
  if(!UI.panel && enJuego()) UI.pausa = true;
  abrirPanel('ayuda');
}
function limpiarEfectos(){ UI.efectos.length = 0; UI.particulas.length = 0; UI.fuegos.length = 0; UI.sacudida = 0; UI.destello = 0; UI.rojo = 0; UI.ola = 0; Array.prototype.forEach.call(document.querySelectorAll('.vuelo'), function(el){ el.parentNode.removeChild(el); }); }
function enfocarLienzo(){ try{ lienzo.focus({ preventScroll:true }); }catch(e){ lienzo.focus(); } }
function iniciar(modo, indice){
  Sonido.despertar(); cerrarPanel(); UI.pausa = false; limpiarEfectos(); UI.recordNuevo = false; hudPrev = {}; UI.teclas = {}; UI.dedos = {}; UI.dedoDisparo = false; UI.firmaLineas = null; UI.tPanelSuperada = -1; UI.victoria = null;
  var sem = modo === 'reto' ? semillaDia() : (((Date.now() % 2147483647) | 0) || 17);
  M.nuevaPartida(modo, { tranquilo:progreso.tranquilo, jugadores:progreso.jugadores, semilla:sem, indice:indice || 0, anio:new Date().getFullYear() });
  procesarEventos(); enfocarLienzo();
}
function enJuego(){ return M.fase === 'preparados' || M.fase === 'jugando' || M.fase === 'golpe'; }
function jugable(){ return enJuego() && !UI.panel && !UI.pausa; }
function alternarPausa(){
  if(UI.panel){ if(UI.panel === 'pausa') cerrarPanelVolver(); return; }
  if(!enJuego()) return;
  UI.pausa = true; abrirPanel('pausa');
}
function alternarSonido(){ var on = Sonido.alternar(); var b = $('bSonido'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? '🔊' : '🔇'; }
$('bSonido').setAttribute('aria-pressed', Sonido.activo() ? 'true' : 'false'); $('bSonido').textContent = Sonido.activo() ? '🔊' : '🔇';
$('bSonido').addEventListener('click', function(){ alternarSonido(); if(jugable()) enfocarLienzo(); });
$('bPausa').addEventListener('click', alternarPausa);
$('bAyuda').addEventListener('click', abrirAyudaDesdeJuego);

/* ---------------- teclado ---------------- */
var TECLAS_UNO = [{ izq:['ArrowLeft', 'a'], der:['ArrowRight', 'd'], fuego:[' ', 'ArrowUp', 'w', 'z'] }];
var TECLAS_DOS = [{ izq:['a'], der:['d'], fuego:['w', ' '] }, { izq:['ArrowLeft'], der:['ArrowRight'], fuego:['ArrowUp', 'Enter'] }];
function mapaTeclas(){ return M.nJug === 2 ? TECLAS_DOS : TECLAS_UNO; }
function teclaNorm(ev){ return (ev.key && ev.key.length === 1) ? ev.key.toLowerCase() : ev.key; }
function actualizarDir(i){
  var m = mapaTeclas()[i], j = M.jugadores[i]; if(!m || !j) return;
  var izq = m.izq.some(function(k){ return UI.teclas[i + ':' + k]; }), der = m.der.some(function(k){ return UI.teclas[i + ':' + k]; });
  if(j.objetivo !== null && !izq && !der) return;
  M.mover(i, izq && !der ? -1 : (der && !izq ? 1 : 0));
}
function disparar(i){ if(!jugable()) return; M.disparar(i); procesarEventos(); }
document.addEventListener('keydown', function(ev){
  var tag = (ev.target && ev.target.tagName) || '', k = teclaNorm(ev);
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(UI.panel){
    if(k === 'Escape' && (UI.panel === 'ayuda' || UI.panel === 'pausa')){ ev.preventDefault(); cerrarPanelVolver(); return; }
    if(k === 'p' && UI.panel === 'pausa'){ ev.preventDefault(); cerrarPanelVolver(); return; }
    if(k === 'm' && tag !== 'INPUT'){ alternarSonido(); var bs = $('mSonido'); if(bs){ bs.setAttribute('aria-pressed', Sonido.activo() ? 'true' : 'false'); bs.innerHTML = (Sonido.activo() ? '✓ ' : '') + 'Sonido<small>' + (Sonido.activo() ? 'sí' : 'no') + '</small>'; } return; }
    return;
  }
  /* en plena partida, Espacio e Intro son del juego aunque el foco se haya quedado en un botón de la cabecera */
  if((tag === 'BUTTON' || tag === 'A') && (k === 'Enter' || k === ' ') && !jugable()) return;
  if(k === 'p' || k === 'Escape'){ ev.preventDefault(); alternarPausa(); return; }
  if(k === 'm'){ alternarSonido(); return; }
  if(k === '?'){ abrirAyudaDesdeJuego(); return; }
  if(k === 'l'){ anunciarPompas(); return; }
  if(!jugable()) return;
  var mapa = mapaTeclas();
  for(var i = 0; i < mapa.length; i++){
    var m = mapa[i];
    if(m.izq.indexOf(k) >= 0 || m.der.indexOf(k) >= 0){ ev.preventDefault(); Sonido.despertar(); UI.teclas[i + ':' + k] = true; actualizarDir(i); return; }
    if(m.fuego.indexOf(k) >= 0){ ev.preventDefault(); if(tag === 'BUTTON') enfocarLienzo(); UI.teclas[i + ':' + k] = true; M.gatillo(i, true); if(ev.repeat) return; Sonido.despertar(); disparar(i); return; }
  }
});
document.addEventListener('keyup', function(ev){
  var k = teclaNorm(ev), mapa = mapaTeclas();
  for(var i = 0; i < mapa.length; i++){ if(UI.teclas[i + ':' + k]){ delete UI.teclas[i + ':' + k]; actualizarDir(i); actualizarGatillo(i); } }
});
/* con la ráfaga, las balitas salen mientras siga pulsada alguna tecla de disparo (o el dedo en ¡ARPÓN!) */
function actualizarGatillo(i){ var m = mapaTeclas()[i]; if(!m) return; M.gatillo(i, m.fuego.some(function(q){ return UI.teclas[i + ':' + q]; }) || (i === 0 && !!UI.dedoDisparo)); }

/* ---------------- mandos táctiles: se puede deslizar el dedo de una flecha a la otra ---------------- */
function dirBajo(x, y){ var el = document.elementFromPoint(x, y); if(!el) return 0; if(el.closest && el.closest('#bIzq')) return -1; if(el.closest && el.closest('#bDer')) return 1; return 0; }
function aplicarDedos(){
  var ids = Object.keys(UI.dedos), dir = ids.length ? UI.dedos[ids[ids.length - 1]] : 0;
  $('bIzq').classList.toggle('pulsado', dir < 0); $('bDer').classList.toggle('pulsado', dir > 0);
  if(!jugable() || !M.jugadores[0]) return;
  if(dir || M.jugadores[0].objetivo === null) M.mover(0, dir);
}
var flechas = $('flechas');
flechas.addEventListener('pointerdown', function(ev){ ev.preventDefault(); Sonido.despertar(); try{ flechas.setPointerCapture(ev.pointerId); }catch(e){} UI.dedos[ev.pointerId] = dirBajo(ev.clientX, ev.clientY); aplicarDedos(); });
flechas.addEventListener('pointermove', function(ev){ if(!(ev.pointerId in UI.dedos)) return; var d = dirBajo(ev.clientX, ev.clientY); if(d !== UI.dedos[ev.pointerId]){ UI.dedos[ev.pointerId] = d; aplicarDedos(); } });
function soltarDedo(ev){ if(!(ev.pointerId in UI.dedos)) return; delete UI.dedos[ev.pointerId]; aplicarDedos(); }
flechas.addEventListener('pointerup', soltarDedo); flechas.addEventListener('pointercancel', soltarDedo); flechas.addEventListener('lostpointercapture', soltarDedo);
var bDisparo = $('bDisparo');
bDisparo.addEventListener('pointerdown', function(ev){ ev.preventDefault(); Sonido.despertar(); bDisparo.classList.add('pulsado'); UI.dedoDisparo = true; actualizarGatillo(0); disparar(0); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(t){ bDisparo.addEventListener(t, function(){ bDisparo.classList.remove('pulsado'); UI.dedoDisparo = false; actualizarGatillo(0); }); });
bDisparo.addEventListener('click', function(ev){ if(ev.detail === 0){ Sonido.despertar(); disparar(0); } });
lienzo.addEventListener('pointerdown', function(ev){
  Sonido.despertar();
  if(!jugable()) return;
  ev.preventDefault(); enfocarLienzo();
  UI.guia = ev.pointerId; try{ lienzo.setPointerCapture(ev.pointerId); }catch(e){}
  M.moverA(0, aLogicoX(ev.clientX));
});
lienzo.addEventListener('pointermove', function(ev){ if(UI.guia === ev.pointerId && jugable()) M.moverA(0, aLogicoX(ev.clientX)); });
function finGuia(ev){ if(UI.guia === ev.pointerId) UI.guia = null; }
lienzo.addEventListener('pointerup', finGuia);
lienzo.addEventListener('pointercancel', finGuia);
$('mandos').hidden = !TACTIL;
$('app').classList.toggle('tactil', TACTIL);

document.addEventListener('visibilitychange', function(){ if(document.hidden && !UI.panel && enJuego()) alternarPausa(); });
window.addEventListener('resize', ajustar);
if(window.ResizeObserver){ try{ new ResizeObserver(function(){ ajustar(); }).observe($('escenario')); }catch(e){} }
window.addEventListener('blur', function(){ UI.teclas = {}; UI.dedos = {}; UI.guia = null; UI.dedoDisparo = false; M.jugadores.forEach(function(j){ M.gatillo(j.i, false); if(j.objetivo === null) M.mover(j.i, 0); }); });

/* ---------------- bucle ---------------- */
var prevTs = 0, acc = 0, PASO = 1 / 120;
function temporizadores(dt){
  if(UI.sacudida > 0) UI.sacudida = Math.max(0, UI.sacudida - dt * 3);
  if(UI.destello > 0) UI.destello = Math.max(0, UI.destello - dt * 2.5);
  if(UI.rojo > 0) UI.rojo = Math.max(0, UI.rojo - dt * 2);
  if(UI.ola > 0) UI.ola = Math.max(0, UI.ola - dt);
  if(UI.banner){ UI.banner.t -= dt; if(UI.banner.t <= 0) UI.banner = null; }
  if(UI.tPanelSuperada > 0 && !UI.panel && !UI.pausa){ UI.tPanelSuperada -= dt; if(UI.tPanelSuperada <= 0){ UI.tPanelSuperada = -1; if(M.fase === 'superada') abrirPanel('superada'); } }
}
function tic(ts){
  requestAnimationFrame(tic);
  if(!prevTs) prevTs = ts; var dt = Math.min(0.05, (ts - prevTs) / 1000); prevTs = ts; UI.reloj += dt;
  if(!UI.pausa && !UI.panel && enJuego()){
    acc += dt; var n = 0;
    while(acc >= PASO && n < 12){ M.paso(PASO); acc -= PASO; n++; }
    if(n >= 12) acc = 0;
    procesarEventos();
    if(M.modo === 'criba') renderLineas();
  }
  temporizadores(dt);
  vaciarAvisos(UI.reloj);
  dibujar(UI.pausa || UI.panel === 'pausa' ? 0 : dt); actualizarHUD();
}
ajustar(); abrirPanel('menu');
requestAnimationFrame(tic);

/* ganchos de verificación: avanzar la física a mano cuando el panel del navegador está oculto */
function avanzar(segundos){
  var n = Math.max(1, Math.round((segundos || 1) / PASO));
  for(var i = 0; i < n; i++){ if(!enJuego()) break; M.paso(PASO); if(M.eventos.length > 40) procesarEventos(); }
  procesarEventos(); if(M.modo === 'criba') renderLineas(); UI.reloj += segundos || 1; temporizadores(segundos || 1); dibujar(Math.min(segundos || 1, 0.1)); actualizarHUD(); tUltimoAviso = -9; vaciarAvisos(UI.reloj);
}
window.__pompas = { M:M, E:E, UI:UI, PX:function(){ return PX; }, iniciar:iniciar, avanzar:avanzar, dibujar:dibujar, procesarEventos:procesarEventos, abrirPanel:abrirPanel, cerrarPanel:cerrarPanel,
  ajustar:ajustar, Sonido:Sonido, progreso:progreso, renderLineas:renderLineas, disparar:disparar, irAlMenu:irAlMenu, arbolSVG:arbolSVG, vennSVG:vennSVG, spriteHeroe:spriteHeroe, spriteTexto:spriteTexto };
})();
</script>
