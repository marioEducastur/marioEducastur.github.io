<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Matemáticas I — 1.º Bachillerato</title>
  <style>
    :root {
      color-scheme: light;
      --texto: #182033;
      --texto-suave: #4b5568;
      --fondo: #ffffff;
      --fondo-suave: #f4f7fb;
      --borde: #d6dce7;
      --acento: #2557a7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 68rem;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 6rem) clamp(1rem, 5vw, 3rem);
      color: var(--texto);
      background: var(--fondo);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      line-height: 1.65;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      max-width: 18ch;
      margin: 0 0 1rem;
      color: #111827;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .subtitulo {
      max-width: 48rem;
      margin: 0;
      color: var(--texto-suave);
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
    }

    section {
      padding: clamp(1.25rem, 4vw, 2rem);
      border: 1px solid var(--borde);
      border-radius: 0.75rem;
      background: var(--fondo-suave);
    }

    h2 {
      margin: 0 0 1rem;
      color: #111827;
      font-size: 1.6rem;
    }

    .lista-unidades {
      margin: 0;
      padding-left: 1.25rem;
    }

    .lista-unidades:empty {
      display: none;
    }

    .sin-unidades {
      margin: 0;
      color: var(--texto-suave);
    }

    a {
      color: var(--acento);
      font-weight: 650;
      text-underline-offset: 0.16em;
    }
  </style>
</head>
<body>
  <header>
    <h1>Matemáticas I — 1.º Bachillerato</h1>
    <p class="subtitulo">
      Apuntes y recursos para la modalidad de Ciencias y Tecnología.
    </p>
  </header>

  <main>
    <section aria-labelledby="titulo-unidades">
      <h2 id="titulo-unidades">Unidades</h2>
      <ul class="lista-unidades">
        <li>
          <a href="unidad_01_numeros_reales.html">Unidad 1: Números reales</a>
          — conjuntos numéricos, potencias, radicales, logaritmos, recta real y
          valor absoluto, y aproximaciones, con ocho actividades interactivas.
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
