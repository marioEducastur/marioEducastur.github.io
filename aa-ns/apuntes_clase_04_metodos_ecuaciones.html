<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Mario Rodríguez Boya">

  <title>Apuntes de clase · Miniapuntes · Métodos de ecuaciones e inecuaciones</title>
  <style>
    :root {
      --texto: #172033;
      --suave: #4b5563;
      --fondo: #f2f5fa;
      --tono: #86198f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      color: var(--texto);
      background: var(--fondo);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      line-height: 1.6;
    }

    .puerta {
      width: min(100%, 26rem);
      overflow: hidden;
      border-radius: 1.1rem;
      background: #ffffff;
      box-shadow: 0 18px 50px rgb(23 32 51 / 0.14);
    }

    .cabecera {
      padding: 1.6rem 1.6rem 1.4rem;
      color: #ffffff;
      background:
        radial-gradient(circle at 88% 12%, rgb(255 255 255 / 0.2), transparent 32%),
        linear-gradient(120deg, #4a0d50 0%, #86198f 66%, #c25ac9 100%);
    }

    .antetitulo {
      margin: 0 0 0.3rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.2;
    }

    form {
      display: grid;
      gap: 0.85rem;
      padding: 1.5rem 1.6rem 1.6rem;
    }

    label {
      font-weight: 700;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 2px solid #d5dbe6;
      border-radius: 0.65rem;
      font: inherit;
      font-size: 1.05rem;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--tono);
    }

    .recordar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      color: var(--suave);
      font-weight: 400;
      font-size: 0.92rem;
    }

    button {
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 999px;
      color: #ffffff;
      background: var(--tono);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .aviso {
      min-height: 1.4em;
      margin: 0;
      color: #b4233a;
      font-weight: 700;
    }

    .volver {
      margin: 0;
      font-size: 0.92rem;
    }

    .volver a {
      color: var(--tono);
    }

    footer {
      margin-top: 1.4rem;
      color: var(--suave);
      font-size: 0.78rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div>
    <main class="puerta">
      <div class="cabecera">
        <p class="antetitulo">Apuntes de clase</p>
        <h1>Miniapuntes · Métodos de ecuaciones e inecuaciones</h1>
      </div>
      <form id="formulario" autocomplete="off">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" required autofocus>
        <label class="recordar"><input id="recordar" type="checkbox"> Recordar en este dispositivo</label>
        <button id="entrar" type="submit">Entrar</button>
        <p id="aviso" class="aviso" role="alert"></p>
        <p class="volver"><a href="index.html">Volver a la portada</a></p>
      </form>
    </main>
    <footer>© 2026 Mario Rodríguez Boya. Todos los derechos reservados.</footer>
  </div>

      var LLAVE = "apuntes-de-clase-llave";

      function deBase64(texto) {
        var binario = atob(texto);
        var bytes = new Uint8Array(binario.length);
        for (var i = 0; i < binario.length; i += 1) {
          bytes[i] = binario.charCodeAt(i);
        }
        return bytes;
      }

      function guardada() {
        try {
          return sessionStorage.getItem(LLAVE) || localStorage.getItem(LLAVE);
        } catch (e) {
          return null;
        }
      }

      function guardar(bruta, recordar) {
        try {
          sessionStorage.setItem(LLAVE, bruta);
          if (recordar) {
            localStorage.setItem(LLAVE, bruta);
          }
        } catch (e) {}
      }

      function olvidar() {
        try {
          sessionStorage.removeItem(LLAVE);
          localStorage.removeItem(LLAVE);
        } catch (e) {}
      }

      function derivar(clave) {
        return crypto.subtle
          .importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"])
          .then(function (material) {

              { name: "PBKDF2", salt: new TextEncoder().encode(SAL), iterations: VUELTAS, hash: "SHA-256" },
              material,
              256
            );
          });
      }

          .importKey("raw", bruta, { name: "AES-GCM" }, false, ["decrypt"])
          .then(function (llave) {
            return crypto.subtle.decrypt({ name: "AES-GCM", iv: deBase64(IV) }, llave, deBase64(DATOS));
          })
          .then(function (comprimido) {
            var flujo = new Blob([comprimido]).stream().pipeThrough(new DecompressionStream("gzip"));
            return new Response(flujo).text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          });
      }

      function aBase64(buffer) {
        var bytes = new Uint8Array(buffer);
        var texto = "";
        for (var i = 0; i < bytes.length; i += 1) {
          texto += String.fromCharCode(bytes[i]);
        }
        return btoa(texto);
      }

      var formulario = document.getElementById("formulario");
      var boton = document.getElementById("entrar");
      var aviso = document.getElementById("aviso");

      if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
        aviso.textContent = "Este navegador es demasiado antiguo para abrir los apuntes.";
        boton.disabled = true;
        return;
      }

      var previa = guardada();
      if (previa) {
        abrir(deBase64(previa)).catch(olvidar);
      }

      formulario.addEventListener("submit", function (evento) {
        evento.preventDefault();
        boton.disabled = true;
        aviso.textContent = "";
        var recordar = document.getElementById("recordar").checked;
        derivar(document.getElementById("clave").value)
          .then(function (bruta) {
            return abrir(bruta).then(function () {
              guardar(aBase64(bruta), recordar);
            });
          })
          .catch(function () {
            boton.disabled = false;
            aviso.textContent = "La contraseña no es correcta.";
            document.getElementById("clave").select();
          });
      });
    })();
  </script>
</body>
</html>
