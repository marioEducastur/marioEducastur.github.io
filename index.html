  <title>Apuntes de Matemáticas</title>
  <style>
    :root { color-scheme: light; --texto: #182033; --texto-suave: #4b5568; --borde: #d6dce7; --acento: #2557a7; --error: #b91c1c; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--texto); background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    form { width: 100%; max-width: 22rem; padding: 1.75rem 1.5rem; border: 1px solid var(--borde); border-radius: 0.75rem; background: #f4f7fb; }
    h1 { margin: 0 0 1.25rem; font-size: 1.35rem; color: #111827; }
    label { display: block; margin-bottom: 0.35rem; font-weight: 600; }
    input[type="password"] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--borde); border-radius: 0.5rem; font: inherit; font-size: 16px; }
    .recordar { display: flex; gap: 0.5rem; align-items: center; margin: 0.9rem 0 1.1rem; font-weight: 400; color: var(--texto-suave); font-size: 0.95rem; }
    button { width: 100%; padding: 0.65rem; border: 0; border-radius: 0.5rem; background: var(--acento); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 1.5em; margin: 0.75rem 0 0; color: var(--error); font-size: 0.95rem; }
    footer { margin-top: 2.5rem; color: var(--texto-suave); font-size: 0.84rem; text-align: center; }
  </style>
</head>
<body>
  <form id="candado">
    <h1>Apuntes de Matemáticas</h1>
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required autofocus>
    <label class="recordar"><input id="recordar" type="checkbox" checked> Recordarla en este dispositivo</label>
    <button type="submit">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>
  <footer>© 2026 Mario Rodríguez Boya. Todos los derechos reservados.</footer>

    const GUARDADA = "entrada-llave-v1";
    const deB64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
    async function abrir(llave) {
      const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(DATOS.iv) }, llave, deB64(DATOS.c));
      const nuevo = new DOMParser().parseFromString(new TextDecoder().decode(claro), "text/html");
      document.replaceChild(document.importNode(nuevo.documentElement, true), document.documentElement);
    }
    async function derivar(clave) {
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: deB64(DATOS.sal), iterations: DATOS.it, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    }
    (async () => {
      try {
        const guardada = localStorage.getItem(GUARDADA);
        if (guardada) {
          document.documentElement.style.visibility = "hidden";
          const llave = await crypto.subtle.importKey("raw", deB64(guardada), "AES-GCM", true, ["decrypt"]);
          await abrir(llave);
        }
      } catch (e) {
        try { localStorage.removeItem(GUARDADA); } catch (_) {}
        document.documentElement.style.visibility = "";
      }
    })();
    document.getElementById("candado").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const boton = evento.target.querySelector("button");
      const error = document.getElementById("error");
      boton.disabled = true;
      error.textContent = "";
      try {
        const llave = await derivar(document.getElementById("clave").value);
        const bytes = new Uint8Array(await crypto.subtle.exportKey("raw", llave));
        await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(DATOS.iv) }, llave, deB64(DATOS.c));
        if (document.getElementById("recordar").checked) {
          try { localStorage.setItem(GUARDADA, btoa(String.fromCharCode(...bytes))); } catch (_) {}
        }
        await abrir(llave);
      } catch (e) {
        error.textContent = "Clave incorrecta.";
        boton.disabled = false;
      }
    });
  </script>
